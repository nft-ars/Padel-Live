const waNum = p => { let s = String(p || "").replace(/[^\d+]/g, ""); if (s.startsWith("+")) s = s.slice(1); else if (s.startsWith("00")) s = s.slice(2); else if (s.startsWith("0")) s = "963" + s.slice(1); return s; };
const waLink = (p, msg) => `https://wa.me/${waNum(p)}?text=${encodeURIComponent(msg)}`;
function shrinkPhoto(file){ return new Promise((ok, no) => { const fr = new FileReader(); fr.onerror = no; fr.onload = () => { const im = new Image(); im.onerror = no; im.onload = () => {
  const s = Math.min(1, 900 / Math.max(im.width, im.height)), c = document.createElement("canvas"); c.width = Math.round(im.width * s); c.height = Math.round(im.height * s);
  c.getContext("2d").drawImage(im, 0, 0, c.width, c.height); ok(c.toDataURL("image/jpeg", 0.72)); }; im.src = fr.result; }; fr.readAsDataURL(file); }); }
const clubCover = c => /let.?s.?\s*padel/i.test(c.name || "") ? "lets-cover.jpg" : /ace\s*padel/i.test(c.name || "") ? "ace-cover.jpg" : /trio/i.test(c.name || "") ? "trio-cover.jpg" : /core/i.test(c.name || "") ? "core-cover.jpg" : (c.photo || "");
function clubSkin(c){ const n = c.name || "";
  if (/trio/i.test(n)) return {a: "#2457E0", b: "#C6DB2F", d: "#061033", logo: "trio-logo.png"};
  if (/ace\s*padel/i.test(n)) return {a: "#3B4254", b: "#E4E95C", d: "#0A0B10", logo: "ace-logo.png"};
  if (/let.?s.?\s*padel/i.test(n)) return {a: "#1E44E0", b: "#C9F23E", d: "#03140C", logo: "lets-logo.png", flip: {l1: "#D8F25A", l2: "#B9E52C", l3: "#8FBF16"}};
  if (/core/i.test(n)) return {a: "#2F6B55", b: "#D9B85C", d: "#06140F", logo: "core-logo.png"};
  return {a: "#2F4A41", b: "#C6F03A", d: "#0B1A14", logo: c.logo_url || ""}; }
function clubPic(c){ const ph = clubCover(c); return ph ? `<img src="${esc(ph)}" alt="" loading="lazy">` : courtsArt(); }
function clubLinks(c){ const l = [];
  if (c.maps_url) l.push(`<a class="ghost sm" href="${esc(c.maps_url)}" target="_blank" rel="noopener">${t("map")}</a>`);
  if (c.phone) l.push(`<a class="ghost sm" href="${esc(waLink(c.phone, "Hi, I found you on Padel Live."))}" target="_blank" rel="noopener">WhatsApp</a>`, `<a class="ghost sm" href="tel:${esc(c.phone)}">${t("call")} ${esc(c.phone)}</a>`);
  return l.length ? `<div class="row" style="flex-wrap:wrap;gap:8px">${l.join("")}</div>` : ""; }
function clubForm(club){ return `<form id="clubF" class="card" style="display:flex;flex-direction:column;gap:10px"><h2 style="font-size:17px">${t("clubPage")}</h2>
   <div class="cpic">${clubPic(Object.assign({}, club, S.newPhoto != null ? {photo: S.newPhoto} : {}))}</div>
   <label class="fld"><span>${t("photo")}</span><input type="file" id="cf-photo" accept="image/*"></label>
   <label class="fld"><span>${t("area")}</span><input id="cf-area" value="${esc(club.area || "")}" placeholder="Mezzeh, Kafr Souseh…"></label>
   <label class="fld"><span>${t("about")}</span><textarea id="cf-about" rows="3">${esc(club.about || "")}</textarea></label>
   <label class="fld"><span>${t("mapLink")}</span><input id="cf-maps" value="${esc(club.maps_url || "")}" placeholder="https://maps.app.goo.gl/…" dir="ltr"></label>
   <label class="fld"><span>${t("clubPhone")}</span><input id="cf-phone" value="${esc(club.phone || "")}" inputmode="tel" dir="ltr"></label>
   <button class="cta blue" type="submit">${t("save")}</button></form>`; }
function adminCard(){ if (!S.profile || !S.profile.is_admin) return "";
  return `<div class="card" style="display:flex;flex-direction:column;gap:10px"><b>${t("bkSwT")}</b><span class="note">${t("bkSwS")}</span>${S.clubs.map(c => `<div class="between"><span>${esc(c.name)}</span><div class="chips"><button class="chip" data-bkon="${c.id}|1" aria-pressed="${!!c.booking_on}">${t("bkOn")}</button><button class="chip" data-bkon="${c.id}|0" aria-pressed="${!c.booking_on}">${t("bkOff")}</button></div></div>`).join("")}</div>
  <form id="newClubF" class="card" style="display:flex;flex-direction:column;gap:10px"><b>${t("addClub")}</b>
   <label class="fld"><span>${t("clubName")}</span><input id="nc-name" required></label>
   <div class="grid2"><label class="fld"><span>${t("city")}</span><input id="nc-city" value="Damascus"></label><label class="fld"><span>${t("area")}</span><input id="nc-area"></label></div>
   <label class="fld"><span>${t("courtsList")}</span><input id="nc-courts" placeholder="Court 1, Court 2, Court 3"></label>
   <button class="ghost" type="submit">${t("addClub")}</button>${S.newClub ? `<div class="notice">${t("clubAdded")} <b dir="ltr">${esc(S.newClub.staff_code)}</b></div>` : ""}</form>`; }

function lgCalc(g, cat){ const l = g.league, bs = +l.box_size || 4;
  const days = Math.max(1, Math.round((new Date(l.ends_on) - new Date(l.starts_on)) / 864e5)), rounds = Math.max(1, Math.floor(days / (+l.round_days || 14)));
  const n = (g.signed || []).filter(x => x.cat === cat).length, nb = n ? Math.max(1, Math.round(n / bs)) : 0;
  const sizes = nb ? Array.from({length: nb}, (_, i) => Math.floor(n / nb) + (i < n % nb ? 1 : 0)) : [];
  const minS = sizes.length ? Math.min(...sizes) : bs;
  return {days, weeks: Math.round(days / 7), rounds, n, nb, sizes, guaranteed: Math.max(0, minS - 1) * rounds,
    total: rounds * sizes.reduce((a, x) => a + x * (x - 1) / 2, 0), perRound: Math.max(0, minS - 1)}; }

/* ---------- motion sensor: read files, live Bluetooth packets, swing analysis ---------- */
const SN = {
  R: 0.8,            // metres: wrist-to-racket radius used to turn wrist rotation into racket speed (estimate)
  TH: 500,           // deg/s: a rotation faster than this is a swing
  GAP: 0.6,          // s: two swings closer than this are one swing
  SAT: 1990,         // deg/s: gyro limit of the sensor (2000)
  RALLY: 8           // s: swings closer than this belong to the same rally
};
function snNum(v){ if (v == null) return NaN; const s = String(v).trim().replace(/,(?=\d{1,3}$)/, "."); return s === "" ? NaN : Number(s); }
function snTime(v){
  if (v == null) return NaN; const s = String(v).trim(); if (!s) return NaN;
  if (/^-?\d+(\.\d+)?$/.test(s)){ const n = +s; return n > 1e11 ? n / 1000 : n; }
  const m = s.match(/(\d{1,2}):(\d{2}):(\d{2})(?:[.:](\d+))?/);
  if (m){ const frac = m[4] ? +("0." + m[4]) : 0; const dm = s.match(/(\d{4})[-\/](\d{1,2})[-\/](\d{1,2})/);
    const day = dm ? Date.UTC(+dm[1], +dm[2] - 1, +dm[3]) / 1000 : 0; return day + (+m[1]) * 3600 + (+m[2]) * 60 + (+m[3]) + frac; }
  const d = Date.parse(s); return isNaN(d) ? NaN : d / 1000;
}
function snWallClock(v){ const s = String(v || "").trim(); const dm = s.match(/(\d{4})[-\/](\d{1,2})[-\/](\d{1,2})[ T](\d{1,2}):(\d{2}):(\d{2})/);
  return dm ? new Date(+dm[1], +dm[2] - 1, +dm[3], +dm[4], +dm[5], +dm[6]) : null; }
/* Reads WitMotion exports (txt/csv, tab/comma/space/semicolon, English or Chinese headers). Returns {devices:[{name, rate, start, samples}]} */
function snParse(text){
  const lines = String(text).replace(/^﻿/, "").split(/\r?\n/).filter(l => l.trim());
  const isHead = l => /acc|加速度|ax\b|as\s*x|gyro|角速度/i.test(l);
  const hi = lines.findIndex(isHead); if (hi < 0) throw new Error("noHeader");
  const head = lines[hi]; const sep = head.includes("\t") ? "\t" : head.includes(";") ? ";" : head.includes(",") ? "," : /\s{2,}/.test(head) ? /\s{2,}/ : /\s+/;
  const cols = head.split(sep).map(c => c.trim().toLowerCase().replace(/\s+/g, ""));
  const find = (...res) => cols.findIndex(c => res.some(r => r.test(c)));
  const ix = {
    ax: find(/^(acc|加速度)x/, /^ax\b/, /accelerationx/), ay: find(/^(acc|加速度)y/, /^ay\b/, /accelerationy/), az: find(/^(acc|加速度)z/, /^az\b/, /accelerationz/),
    gx: find(/^(as|gyro|角速度|angularvelocity|w)x/, /^gx\b/), gy: find(/^(as|gyro|角速度|angularvelocity|w)y/, /^gy\b/), gz: find(/^(as|gyro|角速度|angularvelocity|w)z/, /^gz\b/),
    t: find(/^(chip)?time/, /时间/, /^timestamp/, /^date/), dev: find(/device/, /设备/, /^mac/, /^name/)
  };
  if (ix.gx < 0 || ix.gy < 0 || ix.gz < 0) throw new Error("noGyro");
  const by = new Map();
  for (let i = hi + 1; i < lines.length; i++){
    const f = lines[i].split(sep); if (f.length < 4) continue;
    const g = [snNum(f[ix.gx]), snNum(f[ix.gy]), snNum(f[ix.gz])]; if (g.some(isNaN)) continue;
    const a = ix.ax >= 0 ? [snNum(f[ix.ax]), snNum(f[ix.ay]), snNum(f[ix.az])] : [0, 0, 1];
    const dev = ix.dev >= 0 ? String(f[ix.dev] || "").trim() || "Sensor" : "Sensor";
    if (!by.has(dev)) by.set(dev, {name: dev, raw: [], first: ix.t >= 0 ? f[ix.t] : null});
    by.get(dev).raw.push([ix.t >= 0 ? snTime(f[ix.t]) : NaN, a[0], a[1], a[2], g[0], g[1], g[2]]);
  }
  const devices = [...by.values()].filter(d => d.raw.length > 50).map(d => {
    const tt = d.raw.map(r => r[0]); let rate = 100;
    const dts = []; for (let i = 1; i < tt.length && dts.length < 4000; i++){ const x = tt[i] - tt[i - 1]; if (x > 0 && x < 1) dts.push(x); }
    if (dts.length > 20){ dts.sort((a, b) => a - b); rate = Math.round(1 / dts[dts.length >> 1]); }
    const timed = !isNaN(tt[0]) && dts.length > 20;
    const s = {t: new Float64Array(d.raw.length), a: new Float32Array(d.raw.length * 3), g: new Float32Array(d.raw.length * 3)};
    let last = -Infinity;
    d.raw.forEach((r, i) => { let tv = timed && !isNaN(r[0]) ? r[0] - tt[0] : i / rate; if (tv <= last) tv = last + 1 / rate;
      s.t[i] = last = tv; s.a.set([r[1], r[2], r[3]], i * 3); s.g.set([r[4], r[5], r[6]], i * 3); });
    s.rate = rate; return {name: d.name, rate, start: snWallClock(d.first), samples: s, n: d.raw.length};
  });
  if (!devices.length) throw new Error("noRows");
  return {devices};
}
/* WitMotion BLE: 20-byte packets 0x55 0x61 + 9 × int16 LE (acc, gyro, angle) */
function snPackets(buf, out){
  let i = 0;
  while (i + 20 <= buf.length){
    if (buf[i] !== 0x55 || buf[i + 1] !== 0x61){ i++; continue; }
    const v = k => { const x = buf[i + 2 + k * 2] | (buf[i + 3 + k * 2] << 8); return x > 32767 ? x - 65536 : x; };
    out.push([v(0) / 32768 * 16, v(1) / 32768 * 16, v(2) / 32768 * 16, v(3) / 32768 * 2000, v(4) / 32768 * 2000, v(5) / 32768 * 2000]);
    i += 20;
  }
  return buf.slice(i);
}
/* Analysis. hand: "R" or "L"; swap: flip forehand/backhand if the sensor was worn the other way round */
function snAnalyze(s, o){
  o = o || {}; const n = s.t.length, T = s.t, A = s.a, G = s.g;
  const w = new Float32Array(n); let sat = 0;
  for (let i = 0; i < n; i++){ const x = G[i * 3], y = G[i * 3 + 1], z = G[i * 3 + 2]; w[i] = Math.hypot(x, y, z); }
  const peaks = [];
  for (let i = 1; i < n - 1; i++){
    if (w[i] < SN.TH || w[i] < w[i - 1] || w[i] < w[i + 1]) continue;
    const p = peaks[peaks.length - 1];
    if (p && T[i] - T[p] < SN.GAP){ if (w[i] > w[p]) peaks[peaks.length - 1] = i; continue; }
    peaks.push(i);
  }
  const back = (i, sec) => { let j = i; while (j > 0 && T[i] - T[j] < sec) j--; return j; };
  const swings = peaks.map(i => {
    const clipped = [0, 1, 2].some(k => Math.abs(G[i * 3 + k]) >= SN.SAT); if (clipped) sat++;
    const kmh = w[i] * Math.PI / 180 * SN.R * 3.6;
    const j0 = back(i, 0.45), j1 = back(i, 0.12); let ux = 0, c = 0; for (let j = j0; j <= j1; j++){ ux += A[j * 3]; c++; } ux = c ? ux / c : 0;
    let wd = 0; for (let j = i; j > 0 && w[j] > w[i] / 2; j--) wd = T[i] - T[j];
    const zs = Math.sign(G[i * 3 + 2]) * (o.hand === "L" ? -1 : 1) * (o.swap ? -1 : 1);
    return {t: T[i], kmh, clipped, over: ux > 0.35, side: zs < 0 ? "fh" : "bh", wd};
  });
  const ground = swings.filter(x => !x.over).map(x => x.kmh).sort((a, b) => a - b), med = ground.length ? ground[ground.length >> 1] : 0;
  const overs = swings.filter(x => x.over).map(x => x.kmh), otop = overs.length ? Math.max(...overs) : 0;
  const types = {fh: 0, bh: 0, vo: 0, bj: 0, sm: 0}; let smTop = 0;
  swings.forEach(x => {
    if (x.over){ const sm = x.kmh >= Math.max(otop * 0.7, 60); x.type = sm ? "sm" : "bj"; if (sm) smTop = Math.max(smTop, x.kmh); }
    else x.type = x.kmh < med * 0.6 && x.wd < 0.12 ? "vo" : x.side;
    types[x.type]++;
  });
  let active = 0, rallies = 0, longest = 0, run = 0, rs = null, prev = null;
  swings.forEach(x => { if (prev == null || x.t - prev > SN.RALLY){ if (rs != null) active += prev - rs + 2; rs = x.t; rallies++; run = 1; } else run++; longest = Math.max(longest, run); prev = x.t; });
  if (rs != null) active += prev - rs + 2;
  const dur = n ? T[n - 1] - T[0] : 0, B = 24, bins = new Array(B).fill(0);
  swings.forEach(x => { bins[Math.min(B - 1, Math.floor((x.t - T[0]) / (dur || 1) * B))] += x.kmh; });
  const bm = Math.max(1, ...bins); const sp = swings.map(x => x.kmh);
  const r1 = v => Math.round(v * 10) / 10;
  return {
    shots: swings.length, top: sp.length ? r1(Math.max(...sp)) : null, avg: sp.length ? r1(sp.reduce((a, b) => a + b, 0) / sp.length) : null,
    minutes: Math.round(dur / 60), active: r1(active / 60),
    stats: {types, sm_top: smTop ? r1(smTop) : null, sat: sat > 0, sat_n: sat, rallies, longest, rate: s.rate || null, hand: o.hand || "R",
      int: bins.map(v => Math.round(v / bm * 100))}
  };
}

const SN_SVC = "0000ffe5-0000-1000-8000-00805f9a34fb", SN_RX = "0000ffe4-0000-1000-8000-00805f9a34fb", SN_TX = "0000ffe9-0000-1000-8000-00805f9a34fb";

async function snConnect(){

    const srv = await dev.gatt.connect(), svc = await srv.getPrimaryService(SN_SVC), rx = await svc.getCharacteristic(SN_RX);

}
function snData(bytes){ const lv = S.snLv; if (!lv) return; lv.got++;
  const b = new Uint8Array(lv.buf.length + bytes.length); b.set(lv.buf); b.set(bytes, lv.buf.length);
  const rows = []; lv.buf = snPackets(b, rows); if (!lv.rec || !rows.length) return;
  const now = (performance.now() - lv.t0) / 1000;
  rows.forEach((r, k) => { let tv = now - (rows.length - 1 - k) * 0.01; if (tv <= lv.last) tv = lv.last + 0.002; lv.last = tv;
    lv.t.push(tv); lv.a.push(r[0], r[1], r[2]); lv.g.push(r[3], r[4], r[5]); lv.n++;
    if (Math.hypot(r[3], r[4], r[5]) > SN.TH && tv - lv.lastSwing > SN.GAP){ lv.lastSwing = tv; lv.count++; } });
}

  return `<div class="card tdcard"><div class="between"><b>☀️ ${t("tdT")}</b><span class="note">${t("tdFree")}: <b>${d.free}</b></span></div>
    ${+d.mem ? `<button class="sbtn" data-mtab="mem">★ ${t("tdMem")}: ${d.mem} →</button>` : ""}
    ${+d.deal ? `<span class="dealtag">🔥 ${tf("tdDealOn", {p: d.deal})}</span>` : +d.free >= 2 ? `<button class="cta blue sm" data-mtab="set" style="align-self:flex-start">🔥 ${t("tdDeal")}</button>` : ""}</div>`; }
function mgrPosts(club){
  return `<div class="card psform"><b>📣 ${t("psNew")}</b><textarea id="ps-body" maxlength="600" rows="4" placeholder="${t("psPh")}">${esc(S.psBody)}</textarea>
    <label class="fld"><span>${t("psPhoto")}</span><input id="ps-photo" type="file" accept="image/*"></label>${S.psPhoto ? `<img class="fdpic" src="${S.psPhoto}" alt="">` : ""}
    <button class="cta blue" data-psend="${club.id}"${S.busyOp ? " disabled" : ""}>${S.busyOp ? "…" : t("psSend")}</button></div>
   ${(S.mPosts || []).map(p => `<div class="card fd post"><div class="between"><span class="note">${esc(fmtDay(new Date(p.at)))} · ${esc(ago(p.at))}</span><button class="sbtn" data-psdel="${p.id}" aria-label="${t("snDel")}">✕</button></div><p>${esc(p.body)}</p>${p.photo ? `<img class="fdpic" src="${esc(p.photo)}" alt="">` : ""}</div>`).join("") || `<div class="card note">${t("psNone")}</div>`}`; }
async function loadToday(){ if (!S.mClub) return; try { const r = await sb.rpc("club_today", {p_club: S.mClub}); S.today = r.error ? null : r.data; } catch (e) { S.today = null; } }

app.addEventListener("click", async e => {
  const b = e.target.closest("button"); if (!b) return; const d = b.dataset;
  if (d.turl){ location.href = d.turl; return; }
  if (d.alert){ const on = d.alert === "1"; const r = await sb.rpc("set_open_alerts", {p_on: on}); if (r.error){ toast(errMsg(r.error)); return; } if (S.profile) S.profile.alert_open = on; toast(t("saved")); render(); return; }
  if (d.opn != null){ S.opSpots = +d.opn; render(); return; }
  if (d.opr){ S.opRange = d.opr; render(); return; }
  if (d.opsave){ const n = S.opSpots != null ? S.opSpots : S.match.open_spots, lv = myLevel(), rg = S.opRange;
    const lmin = n && rg !== "any" && lv != null ? Math.max(0.5, +(lv - +rg).toFixed(2)) : null, lmax = n && rg !== "any" && lv != null ? Math.min(7, +(lv + +rg).toFixed(2)) : null;
    const r = await sb.rpc("match_set_open", {p_booking: d.opsave, p_spots: n, p_lmin: lmin, p_lmax: lmax}); if (r.error){ toast(errMsg(r.error)); return; }
    toast(n ? "✓ " + t("opSaved") : t("saved")); S.opSpots = null; await loadMatch(d.opsave); render(); return; }
  if (d.seat){ const mid = S.match && S.match.id; if (!mid) return;
    if (!S.seatSel){ S.seatSel = d.seat; render(); return; }
    if (S.seatSel === d.seat){ S.seatSel = null; render(); return; }
    const r = await sb.rpc("match_seat_move", {p_booking: mid, p_a: S.seatSel, p_b: d.seat}); S.seatSel = null;
    if (r.error){ toast(errMsg(r.error)); render(); return; } toast(t("sdSwapped")); await loadMatch(mid); render(); return; }
  if ("lbmore" in d){ S.lbMore = !S.lbMore; if (S.partners == null){ try { const r = await sb.rpc("my_partners"); S.partners = r.error ? [] : r.data || []; } catch (e) { S.partners = []; } } render(); return; }
  if (d.lbinv || d.lbph){ const mid = S.match && S.match.id; if (!mid) return; let ids = [], phs = [];
    if (d.lbinv) ids = [d.lbinv]; else { const el = document.getElementById("lb-ph"), v = el ? el.value.trim() : ""; if (v.replace(/\D/g, "").length < 9){ toast(t("lgPartnerPh")); return; } phs = [v]; }
    const r = await sb.rpc("lobby_invite", {p_booking: mid, p_ids: ids, p_phones: phs}); if (r.error){ toast(errMsg(r.error)); return; }
    toast(tf("lobSent", {n: r.data || 0})); await loadMatch(mid); render(); return; }
  if (d.lbshare){ const r = await sb.rpc("lobby_link", {p_booking: d.lbshare}); if (r.error){ toast(errMsg(r.error)); return; }
    const m = S.match, dd = new Date(m.starts_at), url = location.origin + location.pathname + "#lobby=" + r.data;
    const txt = tf("lobShareTxt", {w: fmtDay(dd) + " " + fmtTime(dd), c: m.club}) + " " + url;
    try { if (navigator.share){ await navigator.share({title: "Padel Live", text: txt}); return; } } catch (e) { if (e && e.name === "AbortError") return; }
    location.href = "https://wa.me/?text=" + encodeURIComponent(txt); return; }
  if (d.lbopen){ const r = await sb.rpc("lobby_open", {p_booking: d.lbopen}); if (r.error){ toast(errMsg(r.error)); return; } toast(t("lobOpened")); await loadMatch(d.lbopen); render(); return; }
  if (d.mjoin){ if (!S.user){ go("auth"); return; } const r = await sb.rpc("join_match", {p_booking: d.mjoin}); if (r.error){ toast(errMsg(r.error)); return; } toast("✓ " + t("joined")); await loadMatch(d.mjoin); render(); return; }
  if (d.rmday){ S.rmDay = d.rmday; render(); return; }
  if (d.rmshift != null){ S.rmShift = +d.rmshift; render(); return; }
  if (d.rmbook){ const m = S.match; const days = nextDays(7), day = S.rmDay || days[days.length - 1];
    const start = addMin(at(day, hhmmOf(new Date(m.starts_at))), S.rmShift || 0);
    S.busyOp = true; render(); const r = await sb.rpc("rematch", {p_booking: d.rmbook, p_start: start.toISOString()}); S.busyOp = false;
    if (r.error){ toast(errMsg(r.error)); render(); return; } toast("✓ " + t("rmDone")); S.rmDay = null; S.rmShift = 0; S.matchId = r.data; await afterAuth(true); go("match"); return; }
  if (d.psend){ const body = (document.getElementById("ps-body") || {}).value || ""; S.psBody = body; S.busyOp = true; render();
    const r = await sb.rpc("staff_post", {p_club: d.psend, p_body: body, p_photo: S.psPhoto}); S.busyOp = false;
    if (r.error){ toast(errMsg(r.error)); render(); return; } toast("✓ " + t("psSent")); S.psBody = ""; S.psPhoto = null; await loadMgrPosts(); render(); return; }
  if (d.psdel){ if (!confirm(t("psDelQ"))) return; const r = await sb.rpc("staff_post_delete", {p_id: +d.psdel}); if (r.error){ toast(errMsg(r.error)); return; } await loadMgrPosts(); render(); return; }
});
app.addEventListener("change", async e => { const el = e.target;
  if (el.id === "ps-photo" && el.files && el.files[0]){ S.psBody = (document.getElementById("ps-body") || {}).value || S.psBody; try { S.psPhoto = await shrinkPhoto(el.files[0]); render(); } catch (x) { toast("Could not read that photo."); } }
});

async function loadClubPosts(){ if (!S.club) return; try { const r = await sb.rpc("club_posts_list", {p_club: S.club.id}); S.clubPosts = r.error ? [] : r.data || []; } catch (e) { S.clubPosts = []; } }

const ls = { get: k => { try { return localStorage.getItem(k); } catch (e) { return null; } }, set: (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} }, del: k => { try { localStorage.removeItem(k); } catch (e) {} } };
(function(){ try { const m = /#lobby=([0-9a-f]{12})/.exec(location.hash); if (m){ ls.set("pl-lobby", m[1]); history.replaceState(null, "", location.pathname + location.search); } } catch (e) {} })();
(function(){ try { const r = new URLSearchParams(location.search).get("ref"); if (r && /^[0-9a-f-]{36}$/i.test(r)) ls.set("pl-ref", r); } catch (e) {} })();

async function loadWI(){ try { const r = await sb.rpc("welcome_info"); if (!r.error) S.wi = r.data; } catch (e) {} }
const isRookie = () => !S.user || !!(S.wi && S.wi.quest && (S.wi.quest.new || (S.wi.quest.rated || 0) < 5) && !S.wi.quest.done);
const nextOnboard = () => ls.get("pl-tjoin") ? "tjoin" : S.user && S.profile && !S.profile.home_club && !ls.get("pl-noclub") ? "pickclub" : "home";

/* someone opened a private-match invite link */
async function lobbyFromLink(){ const tok = ls.get("pl-lobby"); if (!tok || !S.user) return; ls.del("pl-lobby");
  try { const r = await sb.rpc("lobby_accept", {p_token: tok}); if (r.error){ toast(errMsg(r.error)); return; } S.matchId = r.data; go("match"); } catch (e) {} }
/* after sign in / sign up: save the guest's quiz level and the invite */
async function onbAfterAuth(){
  if (!S.user || !S.profile) return;
  const pl = ls.get("pl-plevel");
  if (pl && !S.profile.level_set){ let cl = null; try { cl = JSON.parse(ls.get("pl-pclaim") || "null"); } catch (e) {} const r = await sb.rpc("set_my_level", {p_level: +pl, p_claim: cl}); if (!r.error){ S.profile.level_set = true; S.profile.level = +pl; await loadCard(); } }
  ls.del("pl-plevel");
  const ref = ls.get("pl-ref"); if (ref){ try { await sb.rpc("set_invited_by", {p_ref: ref}); } catch (e) {} ls.del("pl-ref"); }
  await lobbyFromLink();
  ls.set("pl-seen", "1");
  await Promise.all([loadWI(), loadRatePend(), sb.rpc("player_social", {p_user: S.user.id}).then(r => { if (!r.error) S.mySoc = r.data; }).catch(() => {})]);
}

/* tonight strip */
function tonightStrip(){
  const now = new Date(), today = dayKey(now), open = (S.matches || []).filter(m => m.open_spots > 0 && !m.joined);
  let list = open.filter(m => dayKey(new Date(m.starts_at)) === today), lbl = t("tnT");
  if (!list.length){ list = open.filter(m => new Date(m.starts_at) - now < 7 * 864e5); lbl = t("tnWeek"); }
  if (!list.length) return `<button class="card tn" data-go="clubs"><span class="tn-moon">🌙</span><span class="tn-b"><b>${t("tnT")}</b><span class="note">${t("tnNone")}</span></span></button>`;
  const L = myLevel() != null ? myLevel() : S.revealLevel != null ? S.revealLevel : null;
  const atL = L == null ? 0 : list.filter(m => inRange(m, L) && !tooHigh(m)).length;
  const nb = 0;
  return `<button class="card tn" data-go="matches"><span class="tn-moon">🌙</span><span class="tn-b"><b>${lbl}<i class="tn-live"></i></b>
    <span class="tn-n"><em>${tf("tnOpen", {n: list.length})}</em>${L != null ? `<em>${tf("tnLvl", {n: atL})}</em>` : ""}${nb ? `<em class="nb">${tf("tnNb", {n: nb})}</em>` : ""}</span></span><span class="tn-go">→</span></button>`;
}
const dayKey = d => new Intl.DateTimeFormat("en-CA", {timeZone: TZ}).format(d);

/* tournament banner */
function tourBanner(){
  const ts = (S.wi && S.wi.tours || []).filter(x => !ls.get("pl-tx-" + x.slug)); if (!ts.length) return "";
  const x = ts[0], d = new Date(x.starts_on + "T12:00:00");
  return `<div class="tourban"><a href="t.html?${encodeURIComponent(x.slug)}#signup"><span class="tb-cup">🏆</span><span class="tb-b"><b>${esc(x.name)}</b><span>${esc(fmtDay(d))} · ${t("tourOpen")} →</span></span></a><button class="tb-x" data-tourx="${esc(x.slug)}" aria-label="Close">×</button></div>`;
}

/* Rookie Quest */
function questCard(){
  return S.profile && !S.profile.level_set ? `<button class="card lvprompt" data-go="level"><b>${t("setLevel")} →</b><span class="note">${t("levelCardHint")}</span></button>` : "";
  const q = S.wi && S.wi.quest;
  if (!q) return S.profile && !S.profile.level_set ? `<button class="card lvprompt" data-go="level"><b>${t("setLevel")} →</b><span class="note">${t("levelCardHint")}</span></button>` : "";
  if (q.done){ if (ls.get("pl-qdone")) return "";
    return `<div class="card quest done"><span class="q-big">🌱</span><b>${t("qDoneT")}</b><span class="note">${t("qDoneS")}</span><div class="row" style="gap:8px"><button class="cta gold sm" data-qdone="me">${t("qSeeCard")}</button><button class="ghost" style="width:auto;padding:0 14px" data-qdone="">${t("okBtn2")}</button></div></div>`; }
  if (!q.new && q.level && q.match && q.result) return "";
  const steps = [["level", "q1s", `data-go="level"`], ["match", "q2s", `data-go="matches"`], ["result", "q3s", `data-go="me"`], ["invite", "q4s", `data-invite="1"`]];
  const n = steps.filter(([k]) => q[k]).length, cur = steps.findIndex(([k]) => !q[k]);
  return `<div class="card quest"><div class="between"><b>🌱 ${t("qT")}</b><span class="q-n">${n} / 4</span></div>
    <div class="q-bar"><i style="width:${n * 25}%"></i></div><span class="note">${t("qS")}</span>
    <div class="q-steps">${steps.map(([k, lbl, act], i) => `<button class="q-st${q[k] ? " ok" : ""}${i === cur ? " cur" : ""}" ${q[k] && k !== "invite" ? "disabled" : act}><span class="q-ck">${q[k] ? "✓" : i + 1}</span><span class="q-l">${t(lbl)}${k === "invite" && q.invited ? ` <small>· ${tf("q4n", {n: q.invited})}</small>` : ""}</span>${i === cur ? `<span class="q-here">${t("startHere")} →</span>` : ""}</button>`).join("")}</div></div>`;
}

/* guest card on home */
function guestStart(){ return `<button class="card gstart" data-go="level"><span class="gs-card"><b>?</b><small>LEVEL</small></span><span class="tn-b"><b>${t("w1")} →</b><span class="note">${t("w1s")}</span></span></button>`; }

function welcomeHome(){
  if (!S.user) return `${guestStart()}${tonightStrip()}${tourBanner()}`;
  const q = S.wi && S.wi.quest;

}

    ${x.prize ? `<b class="wt-prize">${esc(x.prize)}</b>` : ""}${x.teams ? `<small>${tf("wtTeams", {n: x.teams})}</small>` : ""}

V.reveal = () => { const L = S.revealLevel != null ? S.revealLevel : myLevel(); if (L == null) return V.level();
  const cat = lvCat(L), [, col] = TIER[cat], nm = S.profile && S.profile.full_name ? S.profile.full_name : "";
  return `<main class="rv">

/* teams per group: only splits the knockouts support (2, 3, 4 or 8 groups) */
const TW_GZ = {6: [3], 8: [4], 12: [3, 4, 6], 16: [4], 24: [3, 6], 32: [4]};
const twGz = (tw, c) => { const n = +tw.cats[c], o = TW_GZ[n] || [4]; const z = +((tw.gz || {})[c]); return o.includes(z) ? z : n === 24 ? 6 : o.includes(4) ? 4 : o[0]; };
/* round robin for any group size (circle method) */
function twRR(z){ const a = Array.from({length: z % 2 ? z + 1 : z}, (_, i) => i + 1), n = a.length, out = [];
  for (let r = 0; r < n - 1; r++){ const ms = []; for (let i = 0; i < n / 2; i++){ const x = a[i], y = a[n - 1 - i]; if (x <= z && y <= z) ms.push([Math.min(x, y), Math.max(x, y)]); } out.push(ms); a.splice(1, 0, a.pop()); }
  return out; }
const TW_THEME = c => /trio/i.test(c.name) ? ["trio", "trio-logo.png"] : /ace/i.test(c.name) ? ["ace", "ace-logo.png"] : /let.?s/i.test(c.name) ? ["lets", "lets-logo.png"] : /core/i.test(c.name) ? ["night", "core-logo.png"] : ["night", ""];
const twClubs = () => S.clubs;
const canMakeTour = () => !!(S.user && S.profile && S.profile.is_admin);
function twInit(){
  const cs = twClubs(), c = cs[0]; const d = new Date(Date.now() + 14 * 864e5);
  const courts = c ? S.courts.filter(x => x.club_id === c.id) : [];
  S.tw = {club: c && c.id, name: "", kick: "", start: dayKey(d), days: 4, cats: {A: 12, B: 12, C: 12, D: 12, E: 0, X: 0}, gz: {}, courts: Math.max(1, Math.min(4, courts.length || 2)),
    cn: courts.map(x => x.name), ds: ["16:00", "15:00", "14:00", "12:00", "12:00"], last: "22:30", finals: true, gm: 45, qm: 50, sm: 75, gs: {A: 6, B: 9, C: 6, D: 6, E: 6, X: 6}, prize: "", fee: "", signup: true, replace: false};
}
const twMin = s => { const [h, m] = String(s || "0:0").split(":").map(Number); return h * 60 + (m || 0); };
const twClock = m => { m = ((m % 1440) + 1440) % 1440; const h = Math.floor(m / 60), mi = m % 60; return `${h % 12 || 12}:${String(mi).padStart(2, "0")} ${h < 12 ? "AM" : "PM"}`; };
const twSlug = tw => { const c = S.clubs.find(x => x.id === tw.club) || {}; return ((String(c.name || "").split(/\s+/)[0] + "-" + (tw.name || "cup") + "-" + (tw.start || "").slice(0, 4)).toLowerCase().normalize("NFKD").replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "").slice(0, 40)) || "cup"; };

/* builds the tournament page config: groups, order of play and knockout times */
function twBuild(tw){
  const club = S.clubs.find(c => c.id === tw.club) || {}, [theme, logo] = TW_THEME(club);
  const cats = ["A", "B", "C", "D", "E", "X"].filter(c => tw.cats[c] > 0), C = +tw.courts, D = +tw.days, SIZE = 4;
  const d0 = new Date(tw.start + "T12:00:00+03:00"), dayD = i => new Date(d0.getTime() + (i - 1) * 864e5);
  const fmtD = (d, o) => new Intl.DateTimeFormat("en-GB", Object.assign({timeZone: TZ}, o)).format(d);
  const days = {}, dshort = {}; for (let i = 1; i <= D; i++){ days[i] = fmtD(dayD(i), {weekday: "long", day: "numeric", month: "short"}).replace(",", ""); dshort[i] = fmtD(dayD(i), {weekday: "short"}); }
  const G = [], K = {}, E = {}, span = {}; for (let i = 1; i <= D; i++) E[i] = [];
  let day = 1, t = twMin(tw.ds[0]), n = 0, fits = true; const L = twMin(tw.last);
  const nextDay = () => { if (day > D) return; E[day].push([twClock(t), "end", day < D ? `🌙 Day ${day} ends · see you tomorrow` : "🌙 End of the day"]); day++; if (day <= D) t = twMin(tw.ds[day - 1] || tw.ds[0]); else fits = false; };
  const wave = (items, dur, put) => { for (let i = 0; i < items.length; i += C){ if (day > D){ fits = false; return; } if (t > L) nextDay(); if (day > D) return;
      const ws = items.slice(i, i + C); span[day] = span[day] || [t, t]; ws.forEach((x, j) => put(x, j + 1, day, t)); t += dur; span[day][1] = t; } };
  const order = r => r % 2 ? cats : [...cats].reverse();
  const gsz = c => twGz(tw, c), gr = c => tw.cats[c] / gsz(c), RRc = {}; cats.forEach(c => { RRc[c] = twRR(gsz(c)); });
  const nR = Math.max(...cats.map(c => RRc[c].length), 0);
  for (let r = 0; r < nR; r++){
    const ms = []; order(r).forEach(c => { if (!RRc[c][r]) return; for (let g = 1; g <= gr(c); g++) RRc[c][r].forEach(([a, b]) => ms.push({c, g, a, b})); });
    wave(ms, +tw.gm, (m, court, d, tt) => { n++; G.push({id: "g" + n, cat: m.c, grp: m.g, rnd: r + 1, day: d, time: twClock(tt), court, t1: m.c + ((m.g - 1) * gsz(m.c) + m.a), t2: m.c + ((m.g - 1) * gsz(m.c) + m.b)}); });
  }
  const kput = (lab, court, d, tt) => { K[lab] = `${dshort[d]} ${twClock(tt)} Ct ${court}`; };
  const big = cats.filter(c => gr(c) === 8);
  if (big.length) wave([].concat(...[...big].reverse().map(c => Array.from({length: 8}, (_, i) => `${c} R${i + 1}`))), +tw.qm, kput);
  wave([].concat(...[...cats].reverse().filter(c => gr(c) > 2).map(c => [1, 2, 3, 4].map(i => `${c} QF${i}`))), +tw.qm, kput);
  if (tw.finals && D > 1 && day < D && day <= D){ nextDay(); }
  wave([].concat(...[...cats].reverse().map(c => [`${c} Semi 1`, `${c} Semi 2`])), +tw.sm, kput);
  if (day <= D){ E[day].push([twClock(t), "break", "☕ Break before the finals (15 min)"]); t += 15; }
  wave([...cats].reverse().map(c => `${c} FINAL`), +tw.sm, kput);
  if (day <= D) E[day].push([twClock(t + 15), "award", `🏆 Award ceremony${tw.prize ? ` · $${(+tw.prize).toLocaleString("en-US")} prize pool` : ""}`]);
  const teams = cats.reduce((a, c) => a + +tw.cats[c], 0), cn = {};
  for (let i = 1; i <= C; i++) cn[i] = (tw.cn[i - 1] || "").trim() || `Court ${i}`;
  const words = String(tw.name || "Cup").trim().toUpperCase().split(/\s+/);
  const title = words.length > 1 ? `${esc(words.slice(0, -1).join(" "))} <em>${esc(words[words.length - 1])}</em>` : `<em>${esc(words[0])}</em>`;
  const range = D > 1 ? `${fmtD(dayD(1), {day: "numeric"})}–${fmtD(dayD(D), {day: "numeric", month: "short"})}` : fmtD(dayD(1), {day: "numeric", month: "short"});
  const qual = c => gr(c) === 2 ? "Top 2 of each group go to the semifinals." : gr(c) === 8 ? "Top 2 of each group go to the round of 16." : gr(c) === 4 ? "Top 2 of each group go to the quarterfinals." : "Top 2 of each group and the 2 best 3rd places go to the quarterfinals.";
  const setTxt = v => v === 9 ? "1 set to 9" : "1 set to 6";
  const fmtL = cats.map(c => `${c === "X" ? "Mixed (1 man + 1 woman)" : c}: ${tw.cats[c]} teams, ${gr(c)} groups of ${gsz(c)}, group matches ${setTxt(tw.gs[c])}. ${qual(c)}`).join("<br>");
  const info = `<section class="sec info"><h2>Tournament</h2><dl><dt>Dates</dt><dd>${esc(days[1])}${D > 1 ? " – " + esc(days[D]) : ""}</dd><dt>Format</dt><dd>${fmtL}<br>Knockouts: quarterfinals 1 set to 9; semifinals and finals best of 3 sets with a super tiebreak.</dd>${tw.prize ? `<dt>Prize Pool</dt><dd>$${(+tw.prize).toLocaleString("en-US")}</dd>` : ""}${tw.fee ? `<dt>Entry</dt><dd>$${esc(tw.fee)} per team</dd>` : ""}<dt>Venue</dt><dd>${esc(club.name || "")} · ${C} court${C > 1 ? "s" : ""}</dd></dl></section>`;
  const cfg = {theme, club_logo: logo, kicker: tw.kick || "Tournament", tagline: `${cats.length} categor${cats.length > 1 ? "ies" : "y"} · ${teams} teams · ${C} court${C > 1 ? "s" : ""} · ${club.name || ""}`,
    title_html: title, subtitle: `${range} · ${club.name || ""}`,
    facts: [range, club.name || "", cats.map(c => c === "X" ? "Mixed" : c).join(" · "), `${teams} teams`, `${C} court${C > 1 ? "s" : ""}`, ...(tw.prize ? [`Prize Pool $${(+tw.prize).toLocaleString("en-US")}`] : [])], highlight_last: !!tw.prize,
    cats, catn: Object.fromEntries(cats.map(c => [c, c === "X" ? "Mixed" : `Category ${c}`])), catl: Object.fromEntries(cats.map(c => [c, c === "X" ? "Mixed" : `Cat ${c}`])),
    catv: Object.fromEntries(cats.map(c => [c, c === "A" ? "--gold" : `--cat${c}`])), groups: Object.fromEntries(cats.map(c => [c, gr(c)])), size: SIZE, sizes: Object.fromEntries(cats.map(c => [c, gsz(c)])),
    gsets: Object.fromEntries(cats.map(c => [c, +tw.gs[c]])), days, dshort, format: Object.fromEntries(cats.map(c => [c, setTxt(tw.gs[c])])),
    courts: Array.from({length: C}, (_, i) => i + 1), cn, T: {G, K, E}, info_html: info, signup: tw.signup ? "true" : "false", ...(tw.fee ? {fee: +tw.fee} : {})};
  return {cfg, teams, g: G.length, k: Object.keys(K).length, fits: fits && day <= D, span, days, end: dayD(D), club};
}

function qrSvg(text){ const m = PLQR(text), n = m.length, q = 3, S2 = n + q * 2; let d = "";
  for (let r = 0; r < n; r++) for (let c = 0; c < n; c++) if (m[r][c]) d += `M${c + q} ${r + q}h1v1h-1z`;
  return `<svg class="qr" viewBox="0 0 ${S2} ${S2}" shape-rendering="crispEdges" aria-label="QR"><rect width="${S2}" height="${S2}" fill="#fff"/><path d="${d}" fill="#000"/></svg>`; }

  if (d.fav_club) { g.fillText(`🏟️ Home court: ${d.fav_club}`, W2 / 2, y2); y2 += 80; }

  const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = file.name; document.body.appendChild(a); a.click(); a.remove(); toast(t("rcSaved")); }

/* the player card is a 3D object: it follows your finger, or the phone's tilt (gyroscope) */
const tiltSet = (c, x, y) => { x = Math.max(-1, Math.min(1, x)); y = Math.max(-1, Math.min(1, y));
  c.style.setProperty("--rx", (-y * 16).toFixed(1) + "deg"); c.style.setProperty("--ry", (x * 20).toFixed(1) + "deg");
  c.style.setProperty("--mx", (x * 50 + 50).toFixed(0) + "%"); c.style.setProperty("--px", x.toFixed(3)); c.style.setProperty("--py", y.toFixed(3)); };
let tiltHand = 0;
document.addEventListener("pointermove", e => { const c = e.target.closest && e.target.closest("[data-tilt]"); if (!c) return; const r = c.getBoundingClientRect();
  tiltHand = Date.now(); c.classList.add("held"); tiltSet(c, ((e.clientX - r.left) / r.width - .5) * 2, ((e.clientY - r.top) / r.height - .5) * 2); });
document.addEventListener("pointerout", e => { const c = e.target.closest && e.target.closest("[data-tilt]"); if (c && !c.contains(e.relatedTarget)){ c.classList.remove("held"); tiltSet(c, 0, 0); } });
let gyroBase = null, gyroRaf = 0, gyroAsked = false;
window.addEventListener("deviceorientation", e => { if (e.beta == null || Date.now() - tiltHand < 1500) return; if (gyroRaf) return;
  gyroRaf = requestAnimationFrame(() => { gyroRaf = 0; const c = document.querySelector("[data-tilt]"); if (!c) { gyroBase = null; return; }
    if (!gyroBase) gyroBase = {b: e.beta, g: e.gamma}; gyroBase.b += (e.beta - gyroBase.b) * .02; gyroBase.g += (e.gamma - gyroBase.g) * .02;
    c.classList.add("gyro"); tiltSet(c, (e.gamma - gyroBase.g) / 22, (e.beta - gyroBase.b) / 22); }); });
document.addEventListener("click", e => { if (gyroAsked || !(e.target.closest && e.target.closest("[data-tilt]"))) return; gyroAsked = true;
  try { if (window.DeviceOrientationEvent && typeof DeviceOrientationEvent.requestPermission === "function") DeviceOrientationEvent.requestPermission().catch(() => {}); } catch (x) {} });
