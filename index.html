<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Padel Live</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,700;0,800;1,700;1,800;1,900&family=Barlow:wght@400;500;600;700&family=Cairo:wght@700;800;900&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap">
<style>
/* Layout: one phone-width app column (bottom tab bar, stacked cards), centred on a tinted stage on wide screens */
:root{
  --bg:#F2F5F3; --card:#FFFFFF; --ink:#10201A; --ink-2:#4A5A53; --ink-3:#8A9690; --line:#DCE3DF; --chip:#EEF1EF;
  --blue:#2C5FAE; --blue-2:#1B3F7A; --blue-soft:#E3EBF7; --lime:#E3EE3A; --red:#C4452F; --red-soft:#FBE7E2; --green:#1A6B3C; --green-soft:#DDF2E4;
  --stage:#DDE5E1; --night:#10201A;
  --disp:"Barlow Condensed","Arial Narrow",Arial,sans-serif; --body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1714; --card:#16221D; --ink:#E9EFEB; --ink-2:#A7B5AE; --ink-3:#71807A; --line:#26352E; --chip:#1D2B25;
  --blue:#5B8FE0; --blue-2:#8DB2EE; --blue-soft:#1B2A40; --red:#E06A54; --red-soft:#3A1E19; --green:#6CC08F; --green-soft:#183326; --stage:#070C0A; --night:#060B09; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1714; --card:#16221D; --ink:#E9EFEB; --ink-2:#A7B5AE; --ink-3:#71807A; --line:#26352E; --chip:#1D2B25;
  --blue:#5B8FE0; --blue-2:#8DB2EE; --blue-soft:#1B2A40; --red:#E06A54; --red-soft:#3A1E19; --green:#6CC08F; --green-soft:#183326; --stage:#070C0A; --night:#060B09; color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--stage);color:var(--ink);font:500 15px/1.4 var(--body);-webkit-text-size-adjust:100%}
html[dir="rtl"] body{--disp:"Cairo",Tahoma,sans-serif;--body:"IBM Plex Sans Arabic",Tahoma,sans-serif}
button{font:inherit;color:inherit;cursor:pointer}
a{color:var(--blue);text-decoration:none}
button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid var(--lime);outline-offset:2px}
.app{max-width:440px;margin:0 auto;min-height:100%;background:var(--bg);position:relative;display:flex;flex-direction:column;box-shadow:0 0 60px rgba(0,0,0,.12)}
.demo{background:var(--night);color:#F2F5F3;font:600 12px var(--body);text-align:center;padding:6px max(16px,env(safe-area-inset-right,0px)) 6px max(16px,env(safe-area-inset-left,0px))}
.demo b{color:var(--lime)}
main{flex:1;padding:16px max(16px,env(safe-area-inset-right,0px)) 104px max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:16px}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.hello{font-size:13px;color:var(--ink-2)}
.logo{font:italic 900 28px/1 var(--disp);letter-spacing:.3px;text-transform:uppercase}
.logo i{color:var(--blue);font-style:italic}
html[dir="rtl"] .logo,html[dir="rtl"] h1{font-style:normal;text-transform:none}
h1{margin:0;font:italic 800 30px/1.05 var(--disp);text-transform:uppercase;letter-spacing:.3px}
h2{margin:0;font:italic 800 20px var(--disp);text-transform:uppercase;letter-spacing:.3px}
html[dir="rtl"] h2{font-style:normal}
.row{display:flex;align-items:center;gap:8px}
.between{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.ib{width:40px;height:40px;border-radius:20px;border:1px solid var(--line);background:var(--card);display:grid;place-items:center;position:relative;flex:none}
.ib svg{width:20px;height:20px}
.ib .dot{position:absolute;top:7px;right:8px;width:9px;height:9px;border-radius:50%;background:var(--red);border:2px solid var(--card)}
.pill{white-space:nowrap;height:36px;padding:0 13px;border-radius:18px;border:1px solid var(--line);background:var(--card);font-weight:700;font-size:13px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px}
.hero{background:var(--blue);color:#fff;border-radius:18px;padding:16px 18px;display:flex;flex-direction:column;gap:8px;position:relative;overflow:hidden;border:0}
.hero::after{content:"";position:absolute;right:-30px;top:-30px;width:140px;height:140px;border:2px solid rgba(255,255,255,.18);border-radius:10px;transform:rotate(-14deg)}
.hero .big{font:italic 900 32px/1 var(--disp);text-transform:uppercase}
.tag{font:700 11.5px var(--body);letter-spacing:.5px;border-radius:9px;padding:3px 9px;display:inline-block}
.tag.w{background:rgba(255,255,255,.18);color:#fff}
.tag.g{background:var(--green-soft);color:var(--green)}
.tag.r{background:var(--red);color:#fff}
.tag.b{background:var(--blue-soft);color:var(--blue)}
.tag.l{background:var(--lime);color:#10201A}
.avs{display:flex}
.av{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font:700 12px var(--body);background:#fff;color:var(--blue);border:2px solid var(--blue);margin-inline-end:-8px}
.av.o{border-style:dashed;background:transparent;color:inherit}
.hero .av{border-color:var(--blue)}
.quick{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.quick button{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 6px;display:flex;flex-direction:column;align-items:center;gap:8px;font-weight:700;font-size:14px}
.quick svg{width:26px;height:26px;stroke:var(--blue)}
.live{display:flex;align-items:center;gap:12px;background:var(--night);color:#fff;border-radius:14px;padding:12px 14px;border:0;width:100%;text-align:start}
.live > svg{width:20px;height:20px;flex:none}
.live small{display:block;color:#B8C7C0;font-size:12px}
.blink{animation:blink 1.4s infinite}
@keyframes blink{50%{opacity:.45}}
.mrow{display:flex;align-items:center;gap:12px;width:100%;text-align:start;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.when{width:58px;flex:none;display:flex;flex-direction:column;align-items:center;border-inline-end:1px solid var(--line);padding-inline-end:10px}
.when small{font-size:11px;font-weight:700;color:var(--ink-2);text-transform:uppercase}
.when b{font:800 21px var(--disp)}
.mid{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.mid b{font-size:15px}
.mid span{font-size:13px;color:var(--ink-2)}
nav.tabs{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:440px;background:var(--card);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,minmax(0,1fr));padding:6px max(6px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(6px,env(safe-area-inset-left,0px));z-index:5}
nav.tabs button{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:600;color:var(--ink-2);min-height:46px;justify-content:center}
nav.tabs button[aria-current="page"]{color:var(--blue);font-weight:800}
nav.tabs svg{width:22px;height:22px}
.back{display:flex;align-items:center;gap:10px}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.chip{flex:none;height:36px;padding:0 14px;border-radius:18px;border:1px solid var(--line);background:var(--card);font-weight:700;font-size:13px;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.day{display:flex;flex-direction:column;align-items:center;padding:6px 0;border-radius:10px;border:1px solid var(--line);background:var(--card)}
.day small{font-size:10px;font-weight:700;color:var(--ink-2)}
.day b{font-size:16px}
.day[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.day[aria-pressed="true"] small{color:var(--bg)}
.day.closed{background:var(--red-soft);border-color:transparent;color:var(--red)}
.day.closed small{color:var(--red)}
.seg{display:flex;gap:8px}
.seg button{flex:1;height:42px;border-radius:10px;border:1px solid var(--line);background:var(--card);font-weight:700}
.seg button[aria-pressed="true"]{background:var(--blue);border-color:var(--blue);color:#fff}
.slots{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.slot{height:54px;border-radius:10px;border:1px solid var(--line);background:var(--card);display:flex;flex-direction:column;align-items:center;justify-content:center}
.slot b{font-size:15px}
.slot small{font-size:11px;color:var(--ink-2)}
.slot:disabled{background:var(--chip);color:var(--ink-3);text-decoration:line-through;cursor:default}
.slot[aria-pressed="true"]{background:var(--blue);border-color:var(--blue);color:#fff;box-shadow:0 0 0 3px var(--lime)}
.slot[aria-pressed="true"] small{color:#fff}
.note{font-size:13px;color:var(--ink-2)}
.notice{background:var(--red-soft);color:var(--red);border-radius:12px;padding:10px 12px;font-weight:700;font-size:13px}
.bar{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:440px;background:var(--card);border-top:1px solid var(--line);padding:12px max(16px,env(safe-area-inset-right,0px)) calc(14px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;align-items:center;gap:12px;z-index:6}
.bar .sum{flex:1;min-width:0}
.bar .sum small{display:block;font-size:12px;color:var(--ink-2)}
.bar .sum b{font-size:19px}
.cta{height:52px;padding:0 24px;border-radius:14px;border:0;background:var(--ink);color:var(--bg);font-weight:800;font-size:16px}
.cta.blue{background:var(--blue);color:#fff}
.cta:disabled{opacity:.4;cursor:default}
.cta.wide{width:100%}
.ghost{height:46px;border-radius:12px;border:1px solid var(--line);background:var(--card);font-weight:700;width:100%}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:start;width:100%;background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:12px 14px}
.opt i{flex:none;width:20px;height:20px;border-radius:50%;border:2px solid var(--ink-3);margin-top:2px}
.opt[aria-pressed="true"]{border-color:var(--blue);background:var(--blue-soft)}
.opt[aria-pressed="true"] i{border:6px solid var(--blue)}
.opt b{display:block}
.opt span{font-size:13px;color:var(--ink-2)}
.lines{display:flex;flex-direction:column;gap:8px}
.lines div{display:flex;justify-content:space-between;gap:10px}
.lines .tot{border-top:1px solid var(--line);padding-top:8px;font-weight:800;font-size:17px}
.code{font:800 44px/1 var(--disp);letter-spacing:6px;text-align:center;background:var(--chip);border-radius:14px;padding:14px;font-variant-numeric:tabular-nums}
.check{width:72px;height:72px;border-radius:50%;background:var(--green);display:grid;place-items:center;margin:8px auto 0;box-shadow:0 0 0 10px var(--green-soft)}
.check svg{width:36px;height:36px;stroke:#fff}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kv small{display:block;font-size:11px;font-weight:700;color:var(--ink-2);text-transform:uppercase;letter-spacing:.5px}
.kv b{font-size:16px}
.team{display:flex;flex-direction:column;align-items:center;gap:6px;flex:1}
.team .av{width:52px;height:52px;font-size:15px;margin:0}
.team span{font-size:12px;color:var(--ink-2)}
.vs{font:italic 800 22px var(--disp);color:var(--ink-3)}
.court{display:flex;gap:6px;align-items:stretch;background:var(--blue);border-radius:16px;padding:14px 10px;position:relative}
.court::before{content:"";position:absolute;top:10px;bottom:10px;left:50%;border-left:2px dashed rgba(255,255,255,.7)}
.court .side{flex:1;display:flex;justify-content:space-around;color:#fff}
.court .side span{color:#DCE7FA}
.court .av{background:#fff;border-color:#fff;color:#2C5FAE}
.court .av.o{background:transparent;border-color:#fff;color:#fff}
.chat{display:flex;flex-direction:column;gap:8px}
.msg{display:flex;gap:8px;align-items:flex-end}
.msg p{margin:0;background:var(--chip);border-radius:14px 14px 14px 4px;padding:8px 12px;font-size:14px}
.msg .av{width:28px;height:28px;font-size:10px;margin:0}
.ev{border-radius:18px;overflow:hidden;border:0;padding:0;background:var(--night);color:#fff}
.ev .in{padding:16px;display:flex;flex-direction:column;gap:8px;background:radial-gradient(120% 120% at 100% 0%,rgba(44,95,174,.6),transparent 60%)}
.ev .t{font:italic 900 26px/1 var(--disp);text-transform:uppercase}
.ev .sm{font-size:13px;color:#B8C7C0}
.ev .acts{display:flex;gap:8px;flex-wrap:wrap}
.ev .acts button{height:36px;border-radius:10px;border:1px solid rgba(255,255,255,.3);background:rgba(255,255,255,.08);color:#fff;padding:0 12px;font-weight:700;font-size:13px}
.ev .acts button.y{background:var(--lime);color:#10201A;border-color:var(--lime)}
.date{width:56px;flex:none;border-radius:12px;background:var(--blue-soft);color:var(--blue);display:flex;flex-direction:column;align-items:center;padding:6px 0}
.date small{font-size:11px;font-weight:800}
.date b{font:800 24px/1 var(--disp)}
.score{background:var(--night);color:#fff;border-radius:16px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.score .hd{display:flex;justify-content:space-between;font-size:11px;font-weight:800;letter-spacing:.8px;color:#B8C7C0;text-transform:uppercase}
.score .sp{color:var(--lime)}
.score .ln{display:grid;grid-template-columns:1fr 30px 30px 40px;gap:6px;align-items:center;font-weight:700}
.score .ln span{text-align:center;font:800 22px var(--disp);font-variant-numeric:tabular-nums}
.score .ln .pt{background:var(--lime);color:#10201A;border-radius:8px}
.score .ln.srv b::before{content:"● ";color:var(--lime);font-size:10px;vertical-align:2px}
.flash{animation:flash .6s}
@keyframes flash{0%{background:var(--lime);color:#10201A}}
.rank{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.rank:last-child{border-bottom:0}
.rank .n{width:26px;font:800 20px var(--disp);text-align:center}
.rank .mv{font-size:12px;font-weight:800;width:32px}
.up{color:var(--green)}.down{color:var(--red)}
.rank .pts{margin-inline-start:auto;font-weight:800;font-variant-numeric:tabular-nums}
.rank.me{background:var(--blue-soft);border-radius:12px;padding-inline:10px;border:0}
.podium{display:grid;grid-template-columns:1fr 1fr 1fr;align-items:end;gap:8px;text-align:center}
.podium div{display:flex;flex-direction:column;align-items:center;gap:6px}
.podium .blk{width:100%;border-radius:12px 12px 0 0;background:var(--blue);color:#fff;font:800 26px var(--disp);display:grid;place-items:center}
.podium .av{margin:0;width:46px;height:46px}
.lvl{display:flex;align-items:center;gap:16px}
.ring{width:110px;height:110px;flex:none;position:relative}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font:800 32px var(--disp)}
.spark{width:100%;height:80px}
.res{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
.res:last-child{border-bottom:0}
.res .wl{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;font-weight:800;color:#fff;flex:none}
.wl.w{background:var(--green)}.wl.l{background:var(--red)}
.set{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.set:last-child{border-bottom:0}
.tg{width:48px;height:28px;border-radius:14px;background:var(--line);border:0;position:relative;flex:none}
.tg::after{content:"";position:absolute;top:3px;inset-inline-start:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:.2s}
.tg[aria-pressed="true"]{background:var(--green)}
.tg[aria-pressed="true"]::after{inset-inline-start:23px}
.al{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);align-items:flex-start}
.al:last-child{border-bottom:0}
.al .ic{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;flex:none;font-weight:800}
.al small{display:block;color:var(--ink-3);font-size:12px;margin-top:2px}
.al.new{background:var(--blue-soft);margin-inline:-14px;padding-inline:14px}
.club{display:flex;flex-direction:column;gap:10px;text-align:start;width:100%;padding:0;overflow:hidden}
.club .pic{height:110px;position:relative;background:linear-gradient(180deg,#16324F,#2C5FAE)}
.club .pic svg{position:absolute;inset:0;width:100%;height:100%}
.club .bd{padding:0 14px 14px;display:flex;flex-direction:column;gap:8px}
.mini-slots{display:flex;gap:6px;flex-wrap:wrap}
.mini-slots span{background:var(--chip);border-radius:8px;padding:5px 10px;font-weight:700;font-size:13px}
.signin{min-height:100vh;background:var(--night);color:#fff;display:flex;flex-direction:column;justify-content:space-between;padding:28px max(22px,env(safe-area-inset-right,0px)) calc(28px + env(safe-area-inset-bottom,0px)) max(22px,env(safe-area-inset-left,0px));position:relative;overflow:hidden}
.signin .art{position:absolute;inset:0;opacity:.9;pointer-events:none}
.signin > *{position:relative}
.signin .slogan{font:italic 900 56px/.9 var(--disp);text-transform:uppercase}
.signin .slogan em{color:var(--lime);font-style:italic}
html[dir="rtl"] .signin .slogan{font-style:normal}
.phone{display:flex;gap:8px}
.phone span,.phone input{height:52px;border-radius:12px;border:1px solid rgba(255,255,255,.25);background:rgba(255,255,255,.08);color:#fff;font:700 17px var(--body);padding:0 14px;display:flex;align-items:center}
.phone input{flex:1;min-width:0}
.otp{display:flex;gap:8px;justify-content:center}
.otp input{width:46px;height:56px;text-align:center;font:800 24px var(--disp);border-radius:12px;border:1px solid rgba(255,255,255,.3);background:rgba(255,255,255,.08);color:#fff}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:700;font-size:14px;opacity:0;transition:.25s;z-index:20;max-width:90%;text-align:center;pointer-events:none}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
/* manager */
.mgr{max-width:none}
.mgr-wrap{display:flex;flex-direction:column;gap:14px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat small{display:block;font-size:12px;font-weight:700;color:var(--ink-2)}
.stat b{font:800 30px/1.1 var(--disp)}
.stat span{display:block;font-size:12px;color:var(--green);font-weight:700}
.tl{overflow-x:auto;border:1px solid var(--line);border-radius:14px;background:var(--card)}
.tl-in{min-width:640px;padding:10px}
.tl-h,.tl-r{display:grid;grid-template-columns:80px 1fr;align-items:center}
.tl-h .hrs{display:grid;grid-template-columns:repeat(11,1fr);font-size:11px;font-weight:700;color:var(--ink-2)}
.tl-r{height:52px;border-top:1px solid var(--line)}
.tl-r > b{font-size:13px}
.tl-track{position:relative;height:40px}
.bk{position:absolute;top:2px;bottom:2px;border-radius:8px;padding:3px 7px;font-size:11px;font-weight:700;overflow:hidden;white-space:nowrap}
.bk.paid{background:var(--blue);color:#fff}.bk.open{background:var(--lime);color:#10201A}.bk.dep{background:#F6D9A8;color:#5A3A08}.bk.blk{background:repeating-linear-gradient(-45deg,var(--chip) 0 6px,var(--line) 6px 12px);color:var(--ink-2)}
.dep-row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.dep-row:last-child{border-bottom:0}
.dep-row .who{flex:1 1 160px;min-width:0}
.dep-row .who small{display:block;color:var(--ink-2);font-size:12px}
.sbtn{height:36px;border-radius:10px;border:1px solid var(--line);background:var(--card);padding:0 12px;font-weight:700;font-size:13px}
.sbtn.ok{background:var(--green);border-color:var(--green);color:#fff}
.legend{display:flex;flex-wrap:wrap;gap:10px;font-size:12px;color:var(--ink-2)}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-2px;margin-inline-end:4px}
@media (min-width:900px){
  .app.mgr{max-width:980px}
  .app.mgr .stats{grid-template-columns:repeat(4,1fr)}
}
@media (prefers-reduced-motion:reduce){.blink,.flash{animation:none}.toast,.tg::after{transition:none}}
</style>
</head>
<body>
<div class="app" id="app"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

function tick(){
  const m = LIVE[Math.floor(Math.random() * 2)], w = Math.random() < .5 ? 0 : 1;
  const set = m.g[m.g.length - 1];
  if (m.p[0] === 3 && m.p[1] === 3) { m.p = [0,0]; set[w]++; m.srv = 1 - m.srv; }
  else if (m.p[w] === 3) { m.p = [0,0]; set[w]++; m.srv = 1 - m.srv; }
  else m.p[w]++;
  if ((set[w] >= 6 && set[w] - set[1 - w] >= 2) || set[w] === 7) { m.g.push([0,0]); if (m.g.length > 3) m.g = [[0,0]]; }

  if (S.view === "live") { const el = document.getElementById("live-" + m.court); if (el) el.outerHTML = scoreCard(m); }
}

  <div class="row" style="flex-wrap:wrap"><button class="cta blue" style="height:44px" data-toast="New booking form (prototype).">${t("newBk")}</button><button class="ghost" style="width:auto;padding:0 14px;height:44px" data-toast="Pick a court and time to block (prototype).">${t("block")}</button></div>
  <div class="stats"><div class="card stat"><small>${t("bkToday")}</small><b>11</b><span>+3 vs last Monday</span></div><div class="card stat"><small>${t("filled")}</small><b>82%</b><span>Peak full</span></div><div class="card stat"><small>${t("cash")}</small><b>$265</b><span>at the desk</span></div><div class="card stat"><small>${t("deps")}</small><b>${S.deps.filter(d => d.r).length}</b><span>ShamCash · Syriatel</span></div></div>
  <div class="legend"><span><i style="background:var(--blue)"></i>${t("lgPaid")}</span><span><i style="background:var(--lime)"></i>${t("lgOpen")}</span><span><i style="background:#F6D9A8"></i>${t("lgDep")}</span><span><i style="background:var(--line)"></i>${t("lgBlk")}</span></div>
  <div class="tl" dir="ltr"><div class="tl-in"><div class="tl-h"><span></span><div class="hrs">${hrs.map(h => `<span>${h}</span>`).join("")}</div></div>
   <div class="tl-r"><b>Blue Court</b><div class="tl-track">${bk("paid",16,1.5,"Rami K. · cash")}${bk("paid",19,1.5,"Hashem · paid")}${bk("paid",21,1.5,"Talal · 4/4")}${bk("open",22.5,1.5,"Open match 2/4")}</div></div>
   <div class="tl-r"><b>Red Court</b><div class="tl-track">${bk("blk",14,2,"Glass repair")}${bk("paid",17,1,"Coach Ali")}${bk("dep",19.5,1.5,"Omar · deposit")}${bk("paid",21,1.5,"Karam · cash")}</div></div></div></div>
  <div class="card"><h2 style="font-size:17px">${t("depTitle")}</h2><p class="note" style="margin:4px 0 6px">${t("depTxt")}</p>${deps}</div>
  <div class="card"><div class="between"><h2 style="font-size:17px">${t("prices")}</h2><span class="note">${t("perB")}</span></div>
   <div style="overflow-x:auto"><table style="width:100%;border-collapse:collapse;margin-top:8px;font-variant-numeric:tabular-nums"><thead><tr><th style="text-align:start;padding:6px;font-size:12px;color:var(--ink-2)"></th>${[60,90,120].map(m => `<th style="padding:6px;font-size:12px;color:var(--ink-2)">${m} min</th>`).join("")}</tr></thead><tbody>${[["day","day"],["peak","peak"],["late","late"]].map(([k,l]) => `<tr><td style="padding:8px 6px;border-top:1px solid var(--line);font-weight:700">${k === "peak" ? t("peak") : t(l)}</td>${[60,90,120].map(m => `<td style="padding:8px 6px;border-top:1px solid var(--line);text-align:center">${PRICES[k][m] == null ? "–" : "$" + PRICES[k][m]}</td>`).join("")}</tr>`).join("")}</tbody></table></div></div>
 </main>`; };

/* ---------- render + events ---------- */
const app = document.getElementById("app");
function render(){
  document.documentElement.lang = lang; document.documentElement.dir = lang === "ar" ? "rtl" : "ltr";
  app.classList.toggle("mgr", S.view === "manager");
  app.innerHTML = (S.view === "signin" ? "" : `<div class="demo"><b>●</b> ${t("demo")}</div>`) + (V[S.view] || V.home)();
  if (S.view === "signin" && S.step === 1) { const o = document.getElementById("o0"); if (o) o.focus(); }
}
function go(v){ if (!V[v]) v = "home"; S.view = v; if (location.hash !== "#" + v) history.replaceState(null, "", "#" + v); render(); window.scrollTo(0, 0); }
let tt; function toast(msg){ const el = document.getElementById("toast"); el.textContent = msg; el.classList.add("on"); clearTimeout(tt); tt = setTimeout(() => el.classList.remove("on"), 2400); }
app.addEventListener("click", e => {
  const b = e.target.closest("button,a"); if (!b) return;
  const d = b.dataset;
  if (d.go){ e.preventDefault(); if (d.go === "signin") S.step = 0; go(d.go); return; }
  if ("lang" in d){ lang = lang === "en" ? "ar" : "en"; try { localStorage.setItem("pl-lang", lang); } catch (x) {} render(); return; }
  if (d.toast){ toast(d.toast); return; }
  if (d.match){ S.match = d.match; go("match"); return; }
  if (d.day){ S.day = +d.day; render(); return; }
  if (d.court){ S.court = d.court; if (TAKEN[S.court].includes(S.slot)) S.slot = SLOT_TIMES.find(s => !TAKEN[S.court].includes(s)); render(); return; }
  if (d.dur){ S.dur = +d.dur; if (price() == null) S.slot = "9:00"; render(); return; }
  if (d.slot){ S.slot = d.slot; render(); return; }
  if (d.pay){ S.pay = d.pay; render(); return; }
  if ("split" in d){ S.split = !S.split; render(); return; }
  if ("tg" in d){ b.setAttribute("aria-pressed", b.getAttribute("aria-pressed") !== "true"); return; }
  if ("wa" in d){ S.wa = !S.wa; render(); return; }
  if ("dark" in d){ const r = document.documentElement; r.dataset.theme = r.dataset.theme === "dark" ? "light" : "dark"; render(); return; }
  if ("confirm" in d){ S.bookings++; go("booked-view"); toast("Booking confirmed (prototype)"); return; }
  if (d.mf){ S.mfilter = d.mf; render(); return; }
  if (d.join){ S.joined[d.join] = true; render(); toast(t("joined")); return; }
  if ("read" in d){ S.alertsRead = true; render(); return; }
  if (d.dep){ const ok = d.ok; S.deps.splice(+d.dep, 1); render(); toast(ok ? t("confirmed") : t("rejected")); return; }
  if (b.classList.contains("chip") && b.closest(".chips")){ b.parentElement.querySelectorAll(".chip").forEach(c => c.setAttribute("aria-pressed", c === b)); }
});
app.addEventListener("submit", e => { e.preventDefault(); if (S.view === "signin" && S.step === 0){ S.step = 1; render(); } });
app.addEventListener("input", e => {
  const el = e.target; if (!/^o\d$/.test(el.id)) return;
  el.value = el.value.replace(/\D/g, "").slice(0, 1);
  const i = +el.id[1];
  if (el.value && i < 5) document.getElementById("o" + (i + 1)).focus();
  const all = [0,1,2,3,4,5].map(k => document.getElementById("o" + k).value).join("");
  if (all.length === 6){ toast("Welcome, Talal"); go("home"); S.step = 0; }
});
document.getElementById("app").addEventListener("keydown", e => { if (e.key === "Backspace" && /^o\d$/.test(e.target.id) && !e.target.value && +e.target.id[1] > 0) document.getElementById("o" + (+e.target.id[1] - 1)).focus(); });
window.addEventListener("hashchange", () => { const v = location.hash.slice(1); if (v && v !== S.view && V[v]) { S.view = v; render(); } });
const start = location.hash.slice(1);
S.view = V[start] ? start : "signin";
render();
</script>
</body>
</html>
