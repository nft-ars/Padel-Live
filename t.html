          <button class="su-pmo" data-supm="acc" aria-pressed="${!inv}"><span class="su-pmi">👤</span><span><b>They're already on PlayPal</b><small>Type their WhatsApp number.</small></span></button></div>
        ${inv ? `<button class="btn primary su-wa big" data-suinv${SU.cat && !SU.busy ? "" : " disabled"}>${SU.busy ? "…" : SU.cat ? "Send invite on WhatsApp" : "Pick your category first"}</button>`
          : `<label class="lbl">Partner's WhatsApp number<input id="su-phone" inputmode="tel" dir="ltr" placeholder="+963 9XX XXX XXX" value="${esc(SU.phone)}"></label>
        ${ck ? (!ck.ok ? `<p class="su-bad">${esc(ck.reason)}</p>` : !CFG.level_check ? `<p class="su-ok">✓ ${esc(ck.partner)} · ${esc(CATN[SU.cat] || SU.cat)}</p>` : ck.fits ? `<p class="su-ok">✓ ${esc(ck.partner)} (${(+ck.plevel).toFixed(2)}) · team level ${(+ck.avg).toFixed(2)} · fits ${esc(CATN[SU.cat] || SU.cat)}</p>${suWho(ck)}`
           : `<p class="su-bad">${esc(ck.reason)}</p>${suWho(ck)}<label class="lbl">Ask the organizer for an exception<textarea id="su-note" rows="2" maxlength="300" placeholder="Why you'd like to play in this category">${esc(SU.note)}</textarea></label>`) : ""}
        <div class="su-act"><button class="btn primary" data-susend${SU.busy || !ck || !ck.ok ? " disabled" : ""}>${SU.busy ? "…" : ck && ck.ok && !ck.fits ? "Send request" : "Sign up"}</button></div>`}
        <details class="su-rule"><summary>How team levels work</summary><p class="su-s">The team level (average of both players) must be inside the category, and the stronger player can be at most one category above it. Playing up is always allowed. New players count at the level they told us until their first 5 matches are played.</p></details>
        <button class="btn small ghostl" data-suclose>Cancel</button>
        ${SU.msg ? `<p class="su-bad">${esc(SU.msg)}</p>` : ""}</div>`;
    }
    h += `</section>`;
  }
  if (I.org && I.entries && I.entries.length){
    const cats = [...new Set(I.entries.map(e => e.cat))], oc = SU.orgCat && cats.includes(SU.orgCat) ? SU.orgCat : "";
    const list = I.entries.filter(e => !oc || e.cat === oc), pend = I.entries.filter(e => e.status === "pending").length;
    h += `<section class="sec su org"><h2>Organizer · Entries <small>${pend} waiting</small></h2>
      <div class="su-cats"><button class="chip" data-suocat="" aria-pressed="${!oc}">All</button>${cats.map(k => `<button class="chip" data-suocat="${k}" aria-pressed="${oc === k}">${esc(CATN[k] || k)}</button>`).join("")}</div>
      ${list.map(e => `<div class="su-row${e.status === "pending" ? " pend" : ""}"><div><b>${esc(e.team)}</b> <span class="su-s">${esc(CATN[e.cat] || e.cat)}${e.slot ? ` · ${esc(e.slot)}` : ""}</span>
          <span class="su-s">${esc(e.p1.n)} ${(+e.p1.l).toFixed(2)} + ${esc(e.p2.n)} ${(+e.p2.l).toFixed(2)} · avg ${(+e.avg).toFixed(2)}${e.fits ? "" : ` · <b class="su-badt">outside the rule</b>`}</span>
          <span class="su-s" dir="ltr">${esc(e.p1.ph || "")}${e.p2.ph ? " · " + esc(e.p2.ph) : ""}</span>${e.note ? `<span class="su-note">“${esc(e.note)}”</span>` : ""}</div>
        <div class="su-btns">${e.status === "pending" ? `<button class="btn small primary" data-suset="${e.id}" data-sust="confirmed">Confirm</button><button class="btn small" data-suset="${e.id}" data-sust="rejected">Reject</button>`
          : `<span class="tag">${e.status === "confirmed" ? "✓ In" : "Rejected"}</span>${e.status === "confirmed" ? `<button class="btn small" data-suset="${e.id}" data-sust="rejected">Remove</button>` : ""}`}</div></div>`).join("")}
      <p class="su-s">Confirmed teams go into the first empty place of their category (Group 1 first). To move a team, use Enter scores and edit the names.</p></section>`;
  }
  return h;
}
document.addEventListener("click", async e => {
  const b = e.target.closest("button"); if (!b) return; const d = b.dataset;
  if ("suopen" in d){ SU.open = true; SU.msg = ""; render(); return; }
  if ("sumode" in d){ SU.auth = SU.auth === "up" ? "in" : "up"; SU.msg = ""; render(); return; }
  if ("suauth" in d){ const pass = (document.getElementById("su-apass") || {}).value || ""; SU.busy = true; SU.msg = ""; render();
    let em = SU.aPhone.trim(), r = null;
    if (SU.auth === "up"){ const ps = await sb.rpc("phone_signup", {p_name: SU.aName.trim(), p_phone: phFull(SU.aCC, em), p_pass: pass}); if (ps.error) r = ps; else em = ps.data; }
    else if (!em.includes("@")){ const pl = await sb.rpc("phone_login", {p_phone: em, p_pass: pass}); if (pl.error) r = pl; else if (!pl.data) r = {error: {message: "Wrong phone number or password."}}; else em = pl.data; }
    if (!r) r = await sb.auth.signInWithPassword({email: em, password: pass});
    SU.busy = false; if (r.error){ SU.msg = r.error.message; render(); return; }
    SU.open = true; await loadSU(); return; }
  if ("suinv" in d){ SU.busy = true; SU.msg = ""; render();
    const r = await sb.rpc("t_invite_create", {p_slug: SLUG, p_cat: SU.cat, p_note: SU.note || null}); SU.busy = false;
    if (r.error){ SU.msg = r.error.message; render(); return; }
    SU.myInv = {token: r.data, cat: SU.cat}; SU.open = false; SU.copied = false; render();
    location.href = suWa(r.data, SU.cat); return; }
  if (d.supm){ SU.pmode = d.supm; SU.msg = ""; render(); return; }
  if ("sucopy" in d && SU.myInv){ const u = suInvUrl(SU.myInv.token); try { await navigator.clipboard.writeText(suInvMsg(SU.myInv.token, SU.myInv.cat)); } catch (er) { prompt("Copy this link", u); } SU.copied = true; render(); setTimeout(() => { SU.copied = false; render(); }, 2500); return; }
  if ("sucancel" in d){ if (!confirm("Cancel this invite? The link you sent will stop working.")) return; await sb.rpc("t_invite_cancel", {p_slug: SLUG}); SU.myInv = null; SU.open = true; SU.pmode = "inv"; render(); return; }
  if ("suclose" in d){ SU.open = false; SU.check = null; SU.msg = ""; render(); return; }
  if (d.sucat){ SU.cat = d.sucat; SU.msg = "";
    if (CFG.level_check && SU.info && (!SU.info.level || SU.autoLv)){ const lv = START_LV[d.sucat] || 2.5; const r = await sb.rpc("set_my_level", {p_level: lv, p_claim: {src: "event", cat: d.sucat, raw: lv}});
      if (r.error){ SU.msg = r.error.message; render(); return; } SU.autoLv = true; SU.info.level = lv; }
    suCheck(); render(); return; }
  if (d.suocat != null){ SU.orgCat = d.suocat; render(); return; }
  if ("susend" in d){ SU.busy = true; SU.msg = ""; render();
    const r = await sb.rpc("t_signup", {p_slug: SLUG, p_cat: SU.cat, p_partner_phone: SU.phone, p_note: SU.note || null}); SU.busy = false;
    if (r.error){ SU.msg = r.error.message; render(); return; }
    SU.open = false; SU.phone = ""; SU.note = ""; SU.check = null; await loadSU(); return; }
  if ("suwd" in d){ if (!confirm("Withdraw your team from this tournament?")) return; const r = await sb.rpc("t_withdraw", {p_slug: SLUG}); if (r.error){ alert(r.error.message); return; } await loadSU(); pull(true); return; }
  if (d.suset){ if (d.sust === "rejected" && !confirm("Remove this team?")) return; b.disabled = true;
    const r = await sb.rpc("t_entry_set", {p_id: d.suset, p_status: d.sust}); if (r.error){ alert(r.error.message); b.disabled = false; return; } await loadSU(); pull(true); return; }
});
document.addEventListener("input", e => { const el = e.target;
  if (el.id === "su-phone"){ SU.phone = el.value; suCheck(); return; }
  if (el.id === "su-aname"){ SU.aName = el.value; return; } if (el.id === "su-aphone"){ SU.aPhone = el.value; return; } if (el.id === "su-aphone-cc"){ SU.aCC = el.value; return; }
  if (el.id === "su-note"){ SU.note = el.value; return; } });
loadSU().then(async () => { await loadPass(); render(); if (location.hash === "#signup"){ const e = document.querySelector(".su"), nv = document.querySelector("nav.tabs"); if (e) window.scrollTo({top: e.getBoundingClientRect().top + scrollY - (nv ? nv.getBoundingClientRect().height : 0) - 12}); } });
render();
setInterval(() => { if (!document.hidden) pull(); }, MODE ? 3000 : 8000);
/* instant updates: every score change is pushed to the TV and phones the moment it happens (the timer above stays as a backup) */
let RT = null;
try { if (sb.channel){ RT = sb.channel("tour-" + SLUG, {config: {broadcast: {self: false}}})
  .on("broadcast", {event: "bump"}, m => { const v = m && m.payload && m.payload.v; if (v == null || v !== VERSION) pull(); })
  .on("broadcast", {event: "pt"}, m => { const x = m && m.payload; if (!x || !x.mid || !x.st || editMode) return;
    try { const s = cur(); s.pts = s.pts || {}; s.pts[x.mid] = x.st;
      if (x.fin){ s.scores[x.mid] = x.fin; s.live = s.live.filter(i => i !== x.mid); } else { delete s.scores[x.mid]; if (!s.live.includes(x.mid)) s.live.push(x.mid); }
      render(); } catch (e) {}
    clearTimeout(window.__ptChk); window.__ptChk = setTimeout(() => pull(true), 4000); /* the server stays the source of truth */ })
  .subscribe(); } } catch (e) { RT = null; }
window.__rtBump = v => { try { if (RT) RT.send({type: "broadcast", event: "bump", payload: {v}}); } catch (e) {} };
window.__rtPt = (mid, st, fin) => { try { if (RT) RT.send({type: "broadcast", event: "pt", payload: {mid, st, fin}}); } catch (e) {} };
document.addEventListener("visibilitychange", () => { if (!document.hidden) pull(); });
(async () => { try { const r = await sb.rpc("t_can_edit", {p_slug: SLUG}); if (r.data === true){ canEdit = true; render(); syncResults(); setInterval(() => syncResults(), 20000); } } catch (e) {} })();
/* finished matches go to PlayPal: levels, wins, challenges (only teams that signed up in the app) */
let lastSync = "";
async function syncResults(pin){ if (!canEdit && !pin) return;
  try { const rows = allMatches().filter(m => m.A && m.B && m.A.id && m.B.id && m.s && m.w !== null && m.w !== undefined && !m.flag).map(m => ({mid: m.id, t1: m.A.id, t2: m.B.id, s: m.s, w: m.w}));
    const key = JSON.stringify(rows); if (!rows.length || key === lastSync) return;
    const r = await sb.rpc("t_sync_results", {p_slug: SLUG, p_rows: rows, p_pin: pin || null}); if (!r.error) lastSync = key; } catch (e) {} }

}
const brandFetch = async (u, o) => { const r = await fetch(u, o); try { if (!/\/rest\/v1\/rpc\//.test(String((u && u.url) || u))) return r; const tx = await r.clone().text(); if (!/Padel Live|بادل لايف/.test(tx)) return r; return new Response(tx.replace(/Padel Live/g, "PlayPal").replace(/بادل لايف/g, "بلاي بال"), {status: r.status, statusText: r.statusText, headers: r.headers}); } catch (e) { return r; } };
function tFail(msg){ document.getElementById("app").innerHTML = '<div style="padding:40px 20px;font:500 16px system-ui;color:#333"><p><b>' + msg + '</b></p><p><a href="./">Open PlayPal</a></p><button onclick="location.reload()" style="padding:10px 16px;font:600 15px system-ui">Try again</button></div>'; }
async function tImport(slug, sb){
  var f = null; try { var x = await fetch(slug + ".json", {cache: "no-store"}); if (x.ok) f = await x.json(); } catch (e) {}
  if (!f){ tFail("This tournament isn't published yet."); return; }
  var clubs = []; try { var c = await sb.rpc("my_clubs"); clubs = c.data || []; } catch (e) {}
  if (!clubs.length){ tFail("This tournament isn't published yet. Club staff: sign in to PlayPal first, then open this page again to publish it."); return; }
  document.getElementById("app").innerHTML = '<div style="padding:40px 20px;font:500 16px system-ui;color:#333"><p><b>' + f.name + '</b> is ready to publish to ' + clubs[0].name + '.</p><button id="timp" style="padding:12px 18px;font:700 16px system-ui;border-radius:10px;border:0;background:#1A6B3C;color:#fff">Publish tournament</button><p id="tmsg"></p></div>';
  document.getElementById("timp").onclick = async function(){
    this.disabled = true; var r = await sb.rpc("t_create", {p_slug: slug, p_name: f.name, p_club: clubs[0].id, p_starts: f.starts_on, p_ends: f.ends_on, p_config: f.config, p_state: f.state});
    if (r.error){ document.getElementById("tmsg").textContent = r.error.message; this.disabled = false; return; }
    location.reload();
  };
}
async function tBoot(){
  var slug = (location.search.replace(/^\?/, "").split("&")[0] || "").replace(/[^a-z0-9-]/g, "");
  if (!slug){ tFail("No tournament chosen."); return; }
  var sb;
  try { sb = window.__MOCK || window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY, {auth:{lock: async function(n, w, fn){ return await fn(); }}, global:{fetch: brandFetch}}); } catch (e) { tFail("Can't reach the server."); return; }
  var timer = setTimeout(function(){ tFail("Can't reach the server. Check your connection."); }, 15000);
  try {
    var r = await sb.rpc("t_get", {p_slug: slug});
    clearTimeout(timer);
    if (r.error) throw r.error;
    if (!r.data){ tImport(slug, sb); return; }
    document.title = r.data.name + " · PlayPal";
    startT(r.data.config, r.data.state || {}, r.data.version, slug, r.data.name, sb, r.data.edit_version || 1);
  } catch (e) { clearTimeout(timer); tFail("Can't load the tournament right now."); }
}
(function(){
  if (window.__MOCK) return tBoot();
  var started = false, go = function(){ if (!started){ started = true; tBoot(); } };
  var a = document.createElement("script"); a.src = "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.50.0";
  a.onload = go; a.onerror = function(){ var b = document.createElement("script"); b.src = "https://unpkg.com/@supabase/supabase-js@2.50.0/dist/umd/supabase.js"; b.onload = go; b.onerror = go; document.body.appendChild(b); };
  setTimeout(go, 15000); document.body.appendChild(a);
})();
