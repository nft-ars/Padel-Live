/* ===== Core Night skin: Core Club green + gold, night-court hero, sponsor village ===== */
:root{
  --bg:#F4F1E8; --surface:#FFFFFF; --surface-2:#ECE7DA; --ink:#17271F; --ink-2:#56665E; --line:#DAD3C2;
  --club:#1C2F27; --club-2:#2F4A41; --on-club:#F3EFE4; --gold:#5E6E66; --gold-soft:#E6EAE7;
  --input:#EEF1EF; --hi:#B9C3BD; --hi-2:#D5DBD6; --night:#0E1A15; --night-2:#16271F;
  --display:"Barlow Condensed","Arial Narrow",Arial,sans-serif; --body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1915; --surface:#17241E; --surface-2:#1E2D26; --ink:#ECE8DC; --ink-2:#A5B2AB; --line:#2E3F37;
  --club:#16271F; --club-2:#2A4136; --on-club:#F3EFE4; --gold:#D5DBD6; --gold-soft:#2A332F; --input:#26302B; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1915; --surface:#17241E; --surface-2:#1E2D26; --ink:#ECE8DC; --ink-2:#A5B2AB; --line:#2E3F37;
  --club:#16271F; --club-2:#2A4136; --on-club:#F3EFE4; --gold:#D5DBD6; --gold-soft:#2A332F; --input:#26302B; color-scheme:dark}
body::before{background:var(--night)}

/* hero */
header.top{position:relative;overflow:hidden;background:var(--night);color:#F3EFE4}
header.top .wrap{display:block;padding-block:16px 0}
.hrow{display:flex;align-items:center;gap:10px}
.kick{display:inline-flex;align-items:center;gap:8px;background:rgba(232,70,58,.14);border:1.5px solid #E8463A;color:#FFB3AB;font:800 12px var(--body);letter-spacing:1.8px;text-transform:uppercase;padding:5px 12px;border-radius:999px}
.kick .dot{width:8px;height:8px;border-radius:50%;background:#E8463A;box-shadow:0 0 0 4px rgba(232,70,58,.25);animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.4;transform:scale(.75)}}
header.top .upd{margin-left:auto;text-align:right;font-size:11px;letter-spacing:1px;text-transform:uppercase;opacity:.75}
header.top .upd b{display:block;font:800 16px var(--display);letter-spacing:.6px;color:var(--hi-2);text-transform:none}
.brand{display:flex;align-items:center;gap:14px;margin-top:16px}
header.top .brand .emb{width:64px;height:64px;border-radius:50%;flex:none;box-shadow:0 0 0 2px var(--hi),0 0 30px rgba(213,219,214,.35)}
.brand h1{margin:0;font:italic 900 clamp(40px,10vw,68px)/.86 var(--display);text-transform:uppercase;letter-spacing:.5px}
.brand h1 em{font-style:italic;color:var(--hi-2)}
.brand p{margin:6px 0 0;font:700 12px var(--body);letter-spacing:3px;text-transform:uppercase;color:#C8D2CB}
.scene-wrap{position:relative;margin-top:6px}
.scene{display:block;width:100%;height:clamp(250px,58vw,420px)}
.scene .pane{animation:flick 7s ease-in-out infinite}
@keyframes flick{0%,92%,100%{opacity:1}95%{opacity:.82}}

nav.tabs button:focus-visible{outline:2px solid var(--gold);outline-offset:-2px}
main .wrap{padding-block:16px 48px;display:flex;flex-direction:column;gap:18px}
.admin{background:var(--gold-soft);border:1px solid var(--gold);border-radius:12px;padding:12px 14px;display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.admin strong{font-family:var(--display);font-size:18px;letter-spacing:.5px;text-transform:uppercase}
.admin .msg{font-size:13px;color:var(--ink-2);flex:1 1 200px;min-width:0}
.btn{font:700 15px var(--body);border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:9px 14px;cursor:pointer}
.btn.primary{background:var(--club);color:var(--on-club);border-color:var(--club)}
.btn:disabled{opacity:.45;cursor:default}
.btn:focus-visible,input:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.chip{font:700 14px var(--body);border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:6px 12px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.search{flex:1 1 180px;min-width:0;font:500 15px var(--body);padding:8px 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
.day h2,.sec h2{font-family:var(--display);font-weight:800;font-size:24px;letter-spacing:.5px;text-transform:uppercase;margin:6px 0 10px;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.day h2 small,.sec h2 small{font-family:var(--body);font-size:13px;font-weight:600;color:var(--ink-2);text-transform:none;letter-spacing:0}
.list{display:flex;flex-direction:column;gap:8px}
.slot{font:700 13px var(--body);color:var(--ink-2);letter-spacing:.8px;text-transform:uppercase;margin-top:6px}
.m{background:var(--surface);border:1px solid var(--line);border-radius:12px;display:grid;grid-template-columns:auto 1fr auto;align-items:stretch;overflow:hidden}
.m .side{width:6px}
.m .body{padding:10px 12px;min-width:0;display:flex;flex-direction:column;gap:4px}
.m .meta{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:12px;color:var(--ink-2);font-weight:600}
.tag{font:700 11px var(--body);letter-spacing:.6px;text-transform:uppercase;border-radius:6px;padding:2px 7px}
.row{display:flex;justify-content:space-between;gap:10px;align-items:center}
.tm{font-weight:600;min-width:0;overflow-wrap:anywhere}
.tm.won{font-weight:800}
.tm .id{font-size:12px;font-weight:600;color:var(--ink-2);margin-left:6px}
.tm.ph{color:var(--ink-2);font-weight:500;font-style:italic}
.sc{font-family:var(--display);font-weight:800;font-size:24px;min-width:28px;text-align:right;font-variant-numeric:tabular-nums}
.sc.lose{color:var(--ink-2);font-weight:600}
.m .state{display:flex;align-items:center;padding:0 12px;font:700 11px var(--body);letter-spacing:.6px;text-transform:uppercase;color:var(--ink-2);border-left:1px solid var(--line)}
.m .state.done{color:var(--win)}
.m.final{border-color:var(--gold)}
.m .ins{display:flex;flex-direction:column;justify-content:center;gap:6px;padding:8px 10px;border-left:1px solid var(--line);background:var(--surface-2)}
.ins input{width:52px;font:800 20px var(--display);text-align:center;padding:4px;border-radius:8px;border:1px solid var(--line);background:var(--input);color:var(--ink)}
.warn{color:var(--warn);font-size:12px;font-weight:700}
.note{background:var(--surface-2);border-radius:10px;padding:10px 12px;font-size:13px;color:var(--ink-2)}
.cat-head{border-radius:12px;padding:12px 14px;color:#FFFFFF;font:800 24px var(--display);letter-spacing:.8px;text-transform:uppercase;display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.cat-head small{font:600 13px var(--body);letter-spacing:0;text-transform:none;opacity:.9}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:12px}
.tbl{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden;min-width:0}
.tbl h3{margin:0;padding:10px 12px;font:800 18px var(--display);letter-spacing:.5px;text-transform:uppercase;display:flex;justify-content:space-between;gap:8px;border-bottom:1px solid var(--line)}
.tbl h3 span{font:600 12px var(--body);color:var(--ink-2);letter-spacing:0;text-transform:none;align-self:center}
.tscroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th,td{padding:8px 6px;text-align:center;font-size:14px;border-bottom:1px solid var(--line)}
th{font-size:11px;letter-spacing:.6px;text-transform:uppercase;color:var(--ink-2);font-weight:700}
td.t,th.t{text-align:left}
td.t{font-weight:600;min-width:120px}
td.t .id{display:block;font-size:11px;color:var(--ink-2);font-weight:600}
tr:last-child td{border-bottom:0}
tr.q td{background:transparent}@supports (color:color-mix(in srgb,red 50%,blue)){tr.q td{background:color-mix(in srgb,var(--win) 12%,transparent)}}
td.pts{font-weight:800}
.pill{display:inline-block;font:800 10px var(--body);letter-spacing:.6px;border-radius:5px;padding:1px 5px;margin-left:6px;background:var(--win);color:#FFFFFF;vertical-align:middle}
.pill.tie{background:var(--warn)}
.champ{border-radius:12px;padding:14px;background:var(--gold-soft);border:1px solid var(--gold);display:flex;align-items:center;gap:12px}
.champ .cup{font:800 28px var(--display);color:var(--gold)}
.champ b{font:800 22px var(--display);letter-spacing:.5px;text-transform:uppercase}
.teams{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:8px}
.team{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 10px;display:flex;gap:10px;align-items:center;min-width:0}
.team .badge{font:800 16px var(--display);color:#FFFFFF;border-radius:7px;padding:3px 8px;min-width:44px;text-align:center}
.team input{flex:1;min-width:0;font:600 14px var(--body);padding:6px 8px;border-radius:8px;border:1px solid var(--line);background:var(--input);color:var(--ink)}
.info dl{margin:0;display:grid;grid-template-columns:minmax(120px,max-content) 1fr;gap:8px 16px}
.info dt{font-weight:700}
.info dd{margin:0;color:var(--ink-2)}
.empty{color:var(--ink-2);font-style:italic;padding:8px 0}
.admin{flex-direction:column;align-items:stretch}
.savebar{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--club);color:var(--on-club);padding-block:10px calc(10px + env(safe-area-inset-bottom,0px));box-shadow:0 -6px 18px rgba(0,0,0,.18)}
.savebar .wrap{display:flex;align-items:center;gap:10px}
.savebar span{flex:1;min-width:0;font-size:13px;font-weight:600}
.savebar .btn.primary{background:var(--gold);border-color:var(--gold);color:#141D40}
body.editing main .wrap{padding-bottom:110px}
.adm-top{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.adm-fields{display:grid;grid-template-columns:2fr 1fr 1fr;gap:10px}
.adm-fields label{display:flex;flex-direction:column;gap:4px;font-size:12px;font-weight:700;color:var(--ink-2);min-width:0}
.adm-fields input{font:600 14px var(--body);padding:7px 9px;border-radius:8px;border:1px solid var(--line);background:var(--input);color:var(--ink);min-width:0}
.btn.small{font-size:13px;padding:6px 10px;align-self:flex-start}
.linkbtn{background:none;border:0;color:var(--ink-2);font:600 13px var(--body);text-decoration:underline;cursor:pointer;padding:0}
.notice{display:flex;gap:10px;align-items:baseline;background:var(--club);color:var(--on-club);border-radius:12px;padding:12px 14px;border-left:6px solid var(--gold)}
.notice b{font:800 15px var(--display);letter-spacing:.8px;text-transform:uppercase;color:var(--gold);flex:none}
.notice span{min-width:0;overflow-wrap:anywhere;font-weight:600}
.now,.mycard{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:10px}
.mycard{border-color:var(--gold);background:var(--gold-soft)}
.now-head{display:flex;justify-content:space-between;align-items:center;gap:10px}
.now-head h2{margin:0;font:800 22px var(--display);letter-spacing:.5px;text-transform:uppercase}
.late{font:800 11px var(--body);letter-spacing:.6px;text-transform:uppercase;background:var(--warn);color:#FFFFFF;border-radius:6px;padding:2px 7px;margin-left:8px}
.courts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (max-width:480px){.courts{gap:6px}.court{padding:8px;gap:5px}.court .ct{font-size:15px}.court .mini{padding:6px 7px;font-size:13px}.court .slotlbl{font-size:10px}}
.court{background:var(--surface-2);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:6px;min-width:0}
.ct{font:800 17px var(--display);letter-spacing:.6px;text-transform:uppercase;display:flex;align-items:center}
.slotlbl{font:700 11px var(--body);letter-spacing:.6px;text-transform:uppercase;color:var(--ink-2);display:flex;align-items:center;gap:6px}
.slotlbl.quiet{font-style:italic;text-transform:none;letter-spacing:0;font-weight:600}
.dot{width:8px;height:8px;border-radius:50%;background:#D64545;display:inline-block;animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{50%{opacity:.35}}
.mini{background:var(--surface);border-left:4px solid;border-radius:8px;padding:8px 10px;font-weight:600;display:flex;flex-direction:column;gap:2px;min-width:0;overflow-wrap:anywhere}
.mini .tag{align-self:flex-start;margin-bottom:2px}
.mini .vs{font:700 11px var(--body);color:var(--ink-2);text-transform:uppercase;letter-spacing:.6px}
.mini .ph,.bl .ph{color:var(--ink-2);font-weight:500;font-style:italic}
.mynext{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr);gap:12px;align-items:center}
.mynext small{display:block;font:700 11px var(--body);letter-spacing:.6px;text-transform:uppercase;color:var(--ink-2)}
.mynext b{display:block;font:800 22px var(--display);letter-spacing:.3px}
.mynext span{font-size:13px;color:var(--ink-2);font-weight:600}
.you{font:800 10px var(--body);letter-spacing:.6px;text-transform:uppercase;background:var(--gold);color:#141D40;border-radius:5px;padding:1px 5px;vertical-align:middle}
.flag{font:800 10px var(--body);letter-spacing:.6px;background:var(--surface-2);color:var(--ink-2);border:1px solid var(--line);border-radius:5px;padding:0 5px;vertical-align:middle}
.slot .nb{font-weight:600;text-transform:none;letter-spacing:0;margin-left:6px;opacity:.7}
.m.mine{border-color:var(--gold);box-shadow:inset 0 0 0 1px var(--gold)}
.m.onlive{border-color:#D64545}
.m .state.live{color:#D64545;gap:6px}
.stsel{margin-top:4px;font:600 13px var(--body);padding:6px 8px;border-radius:8px;border:1px solid var(--line);background:var(--surface-2);color:var(--ink);max-width:100%}
tr.me td{box-shadow:inset 0 -2px 0 var(--gold)}
.team.me{border-color:var(--gold)}
.bwrap{overflow-x:auto;padding-block:4px 8px;-webkit-overflow-scrolling:touch}
.br{position:relative}
.bx{position:absolute;background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden;display:flex;flex-direction:column}
.bx.bf{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold)}
.bx.onlive{border-color:#D64545}
.bh{display:flex;justify-content:space-between;gap:6px;padding:3px 8px;background:var(--surface-2);font-size:10.5px;color:var(--ink-2);white-space:nowrap}
.bh b{font:800 12px var(--display);letter-spacing:.6px;text-transform:uppercase;color:var(--ink)}
.bh span{overflow:hidden;text-overflow:ellipsis}
.bl{display:flex;justify-content:space-between;gap:6px;padding:2px 8px;font-size:13px;font-weight:600;align-items:center;flex:1;min-height:0}
.bl + .bl{border-top:1px solid var(--line)}
.bn{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.bs{font:800 16px var(--display);font-variant-numeric:tabular-nums}
.bl.won{font-weight:800}
.bl.lost{color:var(--ink-2)}
.bl.me{background:transparent}@supports (color:color-mix(in srgb,red 50%,blue)){.bl.me{background:color-mix(in srgb,var(--gold) 22%,transparent)}}
.ln{position:absolute;background:var(--ink-2);opacity:.45}
@media (max-width:480px){.adm-fields{grid-template-columns:1fr 1fr}.adm-fields label:first-child{grid-column:1 / -1}.mynext{grid-template-columns:1fr}}

.sched-bar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.days{display:flex;gap:6px}
.dayb{display:flex;flex-direction:column;align-items:center;gap:0;min-width:64px;padding:6px 10px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.dayb b{font:800 18px var(--display);letter-spacing:.8px;text-transform:uppercase}
.dayb span{font-size:11px;font-weight:600;color:var(--ink-2)}
.dayb[aria-selected="true"]{background:var(--club);border-color:var(--club);color:var(--on-club)}
.dayb[aria-selected="true"] span{color:var(--gold)}
.dayb:disabled{opacity:.5;cursor:default}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{border:0;background:var(--surface);color:var(--ink);font:700 13px var(--body);padding:8px 12px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.board{display:flex;flex-direction:column;gap:6px}
.cbox{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:7px;vertical-align:-1px;box-shadow:0 0 0 1.5px rgba(255,255,255,.75);flex:none}
.cbox.c1{background:#D2392E}.cbox.c2{background:#2F6FC0}
.tile.empty{border:0;background:transparent}
.bhd,.brow{display:grid;grid-template-columns:54px minmax(0,1fr) minmax(0,1fr);gap:6px;align-items:stretch}
.bhd{position:sticky;top:calc(env(safe-area-inset-top,0px) + 47px);z-index:3;background:var(--bg);padding-block:6px 4px}
.bc{background:var(--club);color:var(--on-club);border-radius:10px;padding:7px 8px;font:800 15px var(--display);letter-spacing:.8px;text-transform:uppercase;text-align:center;display:flex;justify-content:center;align-items:center;gap:6px;flex-wrap:wrap}
.bc em{font:800 10px var(--body);font-style:normal;background:var(--warn);color:#FFFFFF;border-radius:5px;padding:1px 5px;letter-spacing:.4px}
.tm8{display:flex;flex-direction:column;align-items:flex-end;padding-top:6px;color:var(--ink-2);font-variant-numeric:tabular-nums;line-height:1}
.tm8 b{font:800 17px var(--display);letter-spacing:.3px;color:var(--ink)}
.tm8 small{font:700 10px var(--body);letter-spacing:.6px;margin-top:2px}
.brow.isnow .tm8 b,.brow.isnow .tm8 small{color:#D64545}
.tile{background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--c);border-radius:10px;padding:6px 8px;display:flex;flex-direction:column;gap:2px;min-width:0}
.tile .th{display:flex;justify-content:space-between;align-items:center;gap:4px}
.tt{font:700 10.5px var(--body);letter-spacing:.5px;text-transform:uppercase;color:var(--c);background:var(--cs);border-radius:5px;padding:1px 6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.tst{font:800 10px var(--body);letter-spacing:.5px;text-transform:uppercase;display:flex;align-items:center;gap:4px;flex:none}
.tst.done{color:var(--win)} .tst.live{color:#D64545}
.tl{display:flex;justify-content:space-between;gap:6px;align-items:baseline;font-size:13px;font-weight:600;line-height:1.25}
.tn{min-width:0;overflow-wrap:anywhere}
.ts{font:800 17px var(--display);font-variant-numeric:tabular-nums}
.tl.won{font-weight:800} .tl.lost{color:var(--ink-2)}
.tile.final{border-color:var(--gold);border-left-color:var(--gold);background:var(--gold-soft)}
.tile.onlive{border-color:#D64545;box-shadow:0 0 0 1px #D64545}

.tile.dim{opacity:.28}

@media (max-width:480px){nav.tabs button{font-size:15px;padding:12px 6px;letter-spacing:.6px} .brand h1{font-size:25px} header.top img{width:auto;height:46px} .upd{display:none} .info dl{grid-template-columns:1fr} .info dd{margin-bottom:6px}}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}

/* ===== Core Night skin: Core Club green + gold, night-court hero, sponsor village ===== */
:root{
  --bg:#F3F6E6; --surface:#FFFFFF; --surface-2:#EAEFD7; --ink:#10193A; --ink-2:#495999; --line:#D8E0BC;
  --club:#141E46; --club-2:#23326E; --on-club:#F1F5E2; --gold:#8CA71F; --gold-soft:#EBF6C1;
  --input:#F6FED6; --hi:#BAD744; --hi-2:#D1EE5E; --night:#090F27; --night-2:#0F183A;
  --display:"Barlow Condensed","Arial Narrow",Arial,sans-serif; --body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0B1025; --surface:#111836; --surface-2:#172043; --ink:#EBEFD9; --ink-2:#A5B2AB; --line:#25305E;
  --club:#0F183A; --club-2:#202D61; --on-club:#F1F5E2; --gold:#C9E658; --gold-soft:#313816; --input:#2C3214; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0B1025; --surface:#111836; --surface-2:#172043; --ink:#EBEFD9; --ink-2:#A5B2AB; --line:#25305E;
  --club:#0F183A; --club-2:#202D61; --on-club:#F1F5E2; --gold:#C9E658; --gold-soft:#313816; --input:#2C3214; color-scheme:dark}
body::before{background:var(--night)}

/* hero */
header.top{position:relative;overflow:hidden;background:var(--night);color:#F1F5E2}
header.top .wrap{display:block;padding-block:16px 0}
.hrow{display:flex;align-items:center;gap:10px}
.kick{display:inline-flex;align-items:center;gap:8px;background:rgba(232,70,58,.14);border:1.5px solid #E8463A;color:#FFB3AB;font:800 12px var(--body);letter-spacing:1.8px;text-transform:uppercase;padding:5px 12px;border-radius:999px}
.kick .dot{width:8px;height:8px;border-radius:50%;background:#E8463A;box-shadow:0 0 0 4px rgba(232,70,58,.25);animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.4;transform:scale(.75)}}
header.top .upd{margin-left:auto;text-align:right;font-size:11px;letter-spacing:1px;text-transform:uppercase;opacity:.75}
header.top .upd b{display:block;font:800 16px var(--display);letter-spacing:.6px;color:var(--hi-2);text-transform:none}
.brand{display:flex;align-items:center;gap:14px;margin-top:16px}
header.top .brand .emb{width:64px;height:64px;border-radius:50%;flex:none;box-shadow:0 0 0 2px var(--hi),0 0 30px rgba(186,215,68,.35)}
.brand h1{margin:0;font:italic 900 clamp(40px,10vw,68px)/.86 var(--display);text-transform:uppercase;letter-spacing:.5px}
.brand h1 em{font-style:italic;color:var(--hi-2)}
.brand p{margin:6px 0 0;font:700 12px var(--body);letter-spacing:3px;text-transform:uppercase;color:#6273B7}
.scene-wrap{position:relative;margin-top:6px}
.scene{display:block;width:100%;height:clamp(250px,58vw,420px)}
.scene .pane{animation:flick 7s ease-in-out infinite}
@keyframes flick{0%,92%,100%{opacity:1}95%{opacity:.82}}
.scene .star{animation:tw 4s ease-in-out infinite}
@keyframes tw{50%{opacity:.1}}
.scene .ball{animation:hop 1.6s cubic-bezier(.4,0,.6,1) infinite}
@keyframes hop{50%{transform:translateY(-14px)}}
.scene .beam{animation:beam 5s ease-in-out infinite}
@keyframes beam{50%{opacity:.55}}
.scene-wrap::after{content:"";position:absolute;top:auto;right:0;bottom:0;left:0;height:14%;background:linear-gradient(transparent,var(--night))}

nav.tabs button{flex:1 0 auto;background:none;border:0;color:var(--on-club);opacity:.75;font:700 17px var(--display);letter-spacing:1px;text-transform:uppercase;padding:12px 10px;border-bottom:3px solid transparent;cursor:pointer}
nav.tabs button[aria-selected="true"]{opacity:1;border-bottom-color:var(--gold)}
nav.tabs button:focus-visible{outline:2px solid var(--gold);outline-offset:-2px}
main .wrap{padding-block:16px 48px;display:flex;flex-direction:column;gap:18px}
.admin{background:var(--gold-soft);border:1px solid var(--gold);border-radius:12px;padding:12px 14px;display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.admin strong{font-family:var(--display);font-size:18px;letter-spacing:.5px;text-transform:uppercase}
.admin .msg{font-size:13px;color:var(--ink-2);flex:1 1 200px;min-width:0}
.btn{font:700 15px var(--body);border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:9px 14px;cursor:pointer}
.btn.primary{background:var(--club);color:var(--on-club);border-color:var(--club)}
.btn:disabled{opacity:.45;cursor:default}
.btn:focus-visible,input:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.chip{font:700 14px var(--body);border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:6px 12px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.search{flex:1 1 180px;min-width:0;font:500 15px var(--body);padding:8px 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
.day h2,.sec h2{font-family:var(--display);font-weight:800;font-size:24px;letter-spacing:.5px;text-transform:uppercase;margin:6px 0 10px;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.day h2 small,.sec h2 small{font-family:var(--body);font-size:13px;font-weight:600;color:var(--ink-2);text-transform:none;letter-spacing:0}
.list{display:flex;flex-direction:column;gap:8px}
.slot{font:700 13px var(--body);color:var(--ink-2);letter-spacing:.8px;text-transform:uppercase;margin-top:6px}
.m{background:var(--surface);border:1px solid var(--line);border-radius:12px;display:grid;grid-template-columns:auto 1fr auto;align-items:stretch;overflow:hidden}
.m .side{width:6px}
.m .body{padding:10px 12px;min-width:0;display:flex;flex-direction:column;gap:4px}
.m .meta{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:12px;color:var(--ink-2);font-weight:600}
.tag{font:700 11px var(--body);letter-spacing:.6px;text-transform:uppercase;border-radius:6px;padding:2px 7px}
.row{display:flex;justify-content:space-between;gap:10px;align-items:center}
.tm{font-weight:600;min-width:0;overflow-wrap:anywhere}
.tm.won{font-weight:800}
.tm .id{font-size:12px;font-weight:600;color:var(--ink-2);margin-left:6px}
.tm.ph{color:var(--ink-2);font-weight:500;font-style:italic}
.sc{font-family:var(--display);font-weight:800;font-size:24px;min-width:28px;text-align:right;font-variant-numeric:tabular-nums}
.sc.lose{color:var(--ink-2);font-weight:600}
.m .state{display:flex;align-items:center;padding:0 12px;font:700 11px var(--body);letter-spacing:.6px;text-transform:uppercase;color:var(--ink-2);border-left:1px solid var(--line)}
.m .state.done{color:var(--win)}
.m.final{border-color:var(--gold)}
.m .ins{display:flex;flex-direction:column;justify-content:center;gap:6px;padding:8px 10px;border-left:1px solid var(--line);background:var(--surface-2)}
.ins input{width:52px;font:800 20px var(--display);text-align:center;padding:4px;border-radius:8px;border:1px solid var(--line);background:var(--input);color:var(--ink)}
.warn{color:var(--warn);font-size:12px;font-weight:700}
.note{background:var(--surface-2);border-radius:10px;padding:10px 12px;font-size:13px;color:var(--ink-2)}
.cat-head{border-radius:12px;padding:12px 14px;color:#FFFFFF;font:800 24px var(--display);letter-spacing:.8px;text-transform:uppercase;display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.cat-head small{font:600 13px var(--body);letter-spacing:0;text-transform:none;opacity:.9}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:12px}
.tbl{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden;min-width:0}
.tbl h3{margin:0;padding:10px 12px;font:800 18px var(--display);letter-spacing:.5px;text-transform:uppercase;display:flex;justify-content:space-between;gap:8px;border-bottom:1px solid var(--line)}
.tbl h3 span{font:600 12px var(--body);color:var(--ink-2);letter-spacing:0;text-transform:none;align-self:center}
.tscroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th,td{padding:8px 6px;text-align:center;font-size:14px;border-bottom:1px solid var(--line)}
th{font-size:11px;letter-spacing:.6px;text-transform:uppercase;color:var(--ink-2);font-weight:700}
td.t,th.t{text-align:left}
td.t{font-weight:600;min-width:120px}
td.t .id{display:block;font-size:11px;color:var(--ink-2);font-weight:600}
tr:last-child td{border-bottom:0}
tr.q td{background:transparent}@supports (color:color-mix(in srgb,red 50%,blue)){tr.q td{background:color-mix(in srgb,var(--win) 12%,transparent)}}
td.pts{font-weight:800}
.pill{display:inline-block;font:800 10px var(--body);letter-spacing:.6px;border-radius:5px;padding:1px 5px;margin-left:6px;background:var(--win);color:#FFFFFF;vertical-align:middle}
.pill.tie{background:var(--warn)}
.champ{border-radius:12px;padding:14px;background:var(--gold-soft);border:1px solid var(--gold);display:flex;align-items:center;gap:12px}
.champ .cup{font:800 28px var(--display);color:var(--gold)}
.champ b{font:800 22px var(--display);letter-spacing:.5px;text-transform:uppercase}
.teams{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:8px}
.team{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 10px;display:flex;gap:10px;align-items:center;min-width:0}
.team .badge{font:800 16px var(--display);color:#FFFFFF;border-radius:7px;padding:3px 8px;min-width:44px;text-align:center}
.team input{flex:1;min-width:0;font:600 14px var(--body);padding:6px 8px;border-radius:8px;border:1px solid var(--line);background:var(--input);color:var(--ink)}
.info dl{margin:0;display:grid;grid-template-columns:minmax(120px,max-content) 1fr;gap:8px 16px}
.info dt{font-weight:700}
.info dd{margin:0;color:var(--ink-2)}
.empty{color:var(--ink-2);font-style:italic;padding:8px 0}
.admin{flex-direction:column;align-items:stretch}
.savebar{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--club);color:var(--on-club);padding-block:10px calc(10px + env(safe-area-inset-bottom,0px));box-shadow:0 -6px 18px rgba(0,0,0,.18)}
.savebar .wrap{display:flex;align-items:center;gap:10px}
.savebar span{flex:1;min-width:0;font-size:13px;font-weight:600}
.savebar .btn.primary{background:var(--gold);border-color:var(--gold);color:#171B25}
body.editing main .wrap{padding-bottom:110px}
.adm-top{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.adm-fields{display:grid;grid-template-columns:2fr 1fr 1fr;gap:10px}
.adm-fields label{display:flex;flex-direction:column;gap:4px;font-size:12px;font-weight:700;color:var(--ink-2);min-width:0}
.adm-fields input{font:600 14px var(--body);padding:7px 9px;border-radius:8px;border:1px solid var(--line);background:var(--input);color:var(--ink);min-width:0}
.btn.small{font-size:13px;padding:6px 10px;align-self:flex-start}
.linkbtn{background:none;border:0;color:var(--ink-2);font:600 13px var(--body);text-decoration:underline;cursor:pointer;padding:0}
.notice{display:flex;gap:10px;align-items:baseline;background:var(--club);color:var(--on-club);border-radius:12px;padding:12px 14px;border-left:6px solid var(--gold)}
.notice b{font:800 15px var(--display);letter-spacing:.8px;text-transform:uppercase;color:var(--gold);flex:none}
.notice span{min-width:0;overflow-wrap:anywhere;font-weight:600}
.now,.mycard{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:10px}
.mycard{border-color:var(--gold);background:var(--gold-soft)}
.now-head{display:flex;justify-content:space-between;align-items:center;gap:10px}
.now-head h2{margin:0;font:800 22px var(--display);letter-spacing:.5px;text-transform:uppercase}
.late{font:800 11px var(--body);letter-spacing:.6px;text-transform:uppercase;background:var(--warn);color:#FFFFFF;border-radius:6px;padding:2px 7px;margin-left:8px}
.courts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (max-width:480px){.courts{gap:6px}.court{padding:8px;gap:5px}.court .ct{font-size:15px}.court .mini{padding:6px 7px;font-size:13px}.court .slotlbl{font-size:10px}}
.court{background:var(--surface-2);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:6px;min-width:0}
.ct{font:800 17px var(--display);letter-spacing:.6px;text-transform:uppercase;display:flex;align-items:center}
.slotlbl{font:700 11px var(--body);letter-spacing:.6px;text-transform:uppercase;color:var(--ink-2);display:flex;align-items:center;gap:6px}
.slotlbl.quiet{font-style:italic;text-transform:none;letter-spacing:0;font-weight:600}
.dot{width:8px;height:8px;border-radius:50%;background:#D64545;display:inline-block;animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{50%{opacity:.35}}
.mini{background:var(--surface);border-left:4px solid;border-radius:8px;padding:8px 10px;font-weight:600;display:flex;flex-direction:column;gap:2px;min-width:0;overflow-wrap:anywhere}
.mini .tag{align-self:flex-start;margin-bottom:2px}
.mini .vs{font:700 11px var(--body);color:var(--ink-2);text-transform:uppercase;letter-spacing:.6px}
.mini .ph,.bl .ph{color:var(--ink-2);font-weight:500;font-style:italic}
.mynext{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr);gap:12px;align-items:center}
.mynext small{display:block;font:700 11px var(--body);letter-spacing:.6px;text-transform:uppercase;color:var(--ink-2)}
.mynext b{display:block;font:800 22px var(--display);letter-spacing:.3px}
.mynext span{font-size:13px;color:var(--ink-2);font-weight:600}
.you{font:800 10px var(--body);letter-spacing:.6px;text-transform:uppercase;background:var(--gold);color:#171B25;border-radius:5px;padding:1px 5px;vertical-align:middle}
.flag{font:800 10px var(--body);letter-spacing:.6px;background:var(--surface-2);color:var(--ink-2);border:1px solid var(--line);border-radius:5px;padding:0 5px;vertical-align:middle}
.slot .nb{font-weight:600;text-transform:none;letter-spacing:0;margin-left:6px;opacity:.7}
.m.mine{border-color:var(--gold);box-shadow:inset 0 0 0 1px var(--gold)}
.m.onlive{border-color:#D64545}
.m .state.live{color:#D64545;gap:6px}
.stsel{margin-top:4px;font:600 13px var(--body);padding:6px 8px;border-radius:8px;border:1px solid var(--line);background:var(--surface-2);color:var(--ink);max-width:100%}
tr.me td{box-shadow:inset 0 -2px 0 var(--gold)}
.team.me{border-color:var(--gold)}
.bwrap{overflow-x:auto;padding-block:4px 8px;-webkit-overflow-scrolling:touch}
.br{position:relative}
.bx{position:absolute;background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden;display:flex;flex-direction:column}
.bx.bf{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold)}
.bx.onlive{border-color:#D64545}
.bh{display:flex;justify-content:space-between;gap:6px;padding:3px 8px;background:var(--surface-2);font-size:10.5px;color:var(--ink-2);white-space:nowrap}
.bh b{font:800 12px var(--display);letter-spacing:.6px;text-transform:uppercase;color:var(--ink)}
.bh span{overflow:hidden;text-overflow:ellipsis}
.bl{display:flex;justify-content:space-between;gap:6px;padding:2px 8px;font-size:13px;font-weight:600;align-items:center;flex:1;min-height:0}
.bl + .bl{border-top:1px solid var(--line)}
.bn{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.bs{font:800 16px var(--display);font-variant-numeric:tabular-nums}
.bl.won{font-weight:800}
.bl.lost{color:var(--ink-2)}
.bl.me{background:transparent}@supports (color:color-mix(in srgb,red 50%,blue)){.bl.me{background:color-mix(in srgb,var(--gold) 22%,transparent)}}
.ln{position:absolute;background:var(--ink-2);opacity:.45}
@media (max-width:480px){.adm-fields{grid-template-columns:1fr 1fr}.adm-fields label:first-child{grid-column:1 / -1}.mynext{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){.dot{animation:none}}

.sched-bar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.days{display:flex;gap:6px}
.dayb{display:flex;flex-direction:column;align-items:center;gap:0;min-width:64px;padding:6px 10px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.dayb b{font:800 18px var(--display);letter-spacing:.8px;text-transform:uppercase}
.dayb span{font-size:11px;font-weight:600;color:var(--ink-2)}
.dayb[aria-selected="true"]{background:var(--club);border-color:var(--club);color:var(--on-club)}
.dayb[aria-selected="true"] span{color:var(--gold)}
.dayb:disabled{opacity:.5;cursor:default}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{border:0;background:var(--surface);color:var(--ink);font:700 13px var(--body);padding:8px 12px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.board{display:flex;flex-direction:column;gap:6px}
.cbox{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:7px;vertical-align:-1px;box-shadow:0 0 0 1.5px rgba(255,255,255,.75);flex:none}
.cbox.c1{background:#D2392E}.cbox.c2{background:#9FB33C}
.tile.empty{border:0;background:transparent}
.bhd,.brow{display:grid;grid-template-columns:54px minmax(0,1fr) minmax(0,1fr);gap:6px;align-items:stretch}
.bhd{position:sticky;top:calc(env(safe-area-inset-top,0px) + 47px);z-index:3;background:var(--bg);padding-block:6px 4px}
.bc{background:var(--club);color:var(--on-club);border-radius:10px;padding:7px 8px;font:800 15px var(--display);letter-spacing:.8px;text-transform:uppercase;text-align:center;display:flex;justify-content:center;align-items:center;gap:6px;flex-wrap:wrap}
.bc em{font:800 10px var(--body);font-style:normal;background:var(--warn);color:#FFFFFF;border-radius:5px;padding:1px 5px;letter-spacing:.4px}
.tm8{display:flex;flex-direction:column;align-items:flex-end;padding-top:6px;color:var(--ink-2);font-variant-numeric:tabular-nums;line-height:1}
.tm8 b{font:800 17px var(--display);letter-spacing:.3px;color:var(--ink)}
.tm8 small{font:700 10px var(--body);letter-spacing:.6px;margin-top:2px}
.brow.isnow .tm8 b,.brow.isnow .tm8 small{color:#D64545}
.tile{background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--c);border-radius:10px;padding:6px 8px;display:flex;flex-direction:column;gap:2px;min-width:0}
.tile .th{display:flex;justify-content:space-between;align-items:center;gap:4px}
.tt{font:700 10.5px var(--body);letter-spacing:.5px;text-transform:uppercase;color:var(--c);background:var(--cs);border-radius:5px;padding:1px 6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.tst{font:800 10px var(--body);letter-spacing:.5px;text-transform:uppercase;display:flex;align-items:center;gap:4px;flex:none}
.tst.done{color:var(--win)} .tst.live{color:#D64545}
.tl{display:flex;justify-content:space-between;gap:6px;align-items:baseline;font-size:13px;font-weight:600;line-height:1.25}
.tn{min-width:0;overflow-wrap:anywhere}
.ts{font:800 17px var(--display);font-variant-numeric:tabular-nums}
.tl.won{font-weight:800} .tl.lost{color:var(--ink-2)}
.tile.final{border-color:var(--gold);border-left-color:var(--gold);background:var(--gold-soft)}
.tile.onlive{border-color:#D64545;box-shadow:0 0 0 1px #D64545}
.tile.mine{box-shadow:0 0 0 2px var(--gold)}
.tile.dim{opacity:.28}
.tile.isdone{background:var(--surface-2)}
.tile.empty{border:1px dashed var(--line);background:transparent;color:var(--ink-2);font-size:12px;font-style:italic;align-items:center;justify-content:center}
.brow.ev{grid-template-columns:54px 1fr}
.evt{border-radius:10px;padding:9px 12px;font-weight:700;font-size:13px;background:var(--surface-2);color:var(--ink-2)}
.brow.ev.break .evt{background:var(--gold-soft);color:var(--ink)}
.brow.ev.award .evt{background:var(--club);color:var(--gold);font:800 17px var(--display);letter-spacing:.6px;text-transform:uppercase}
@media (max-width:480px){.bhd,.brow{grid-template-columns:44px minmax(0,1fr) minmax(0,1fr);gap:5px}.brow.ev{grid-template-columns:44px 1fr}.tm8 b{font-size:15px}.tl{font-size:12px}.bhd{top:calc(env(safe-area-inset-top,0px) + 43px)}.dayb{min-width:56px;padding:5px 8px}}
@media (max-width:480px){nav.tabs button{font-size:15px;padding:12px 6px;letter-spacing:.6px} .brand h1{font-size:25px} header.top img{width:auto;height:46px} .upd{display:none} .info dl{grid-template-columns:1fr} .info dd{margin-bottom:6px}}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}

/* ===== Core Night skin: Core Club green + gold, night-court hero, sponsor village ===== */
:root{
  --bg:#D8DCC7; --surface:#FFFFFF; --surface-2:#D8DBC7; --ink:#141721; --ink-2:#464B59; --line:#D8DBC7;
  --club:#181C28; --club-2:#282E3F; --on-club:#D8DBC7; --gold:#99AC39; --gold-soft:#D8DBC7;
  --input:#D8DCC7; --hi:#BDCE6B; --hi-2:#CEDA90; --night:#0C0F16; --night-2:#131721;
  --display:"Barlow Condensed","Arial Narrow",Arial,sans-serif; --body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0D0F15; --surface:#13161F; --surface-2:#191D27; --ink:#D8DCC7; --ink-2:#A5B2AB; --line:#262B36;
  --club:#131721; --club-2:#232938; --on-club:#D8DBC7; --gold:#C9D786; --gold-soft:#464E1E; --input:#41491C; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D0F15; --surface:#13161F; --surface-2:#191D27; --ink:#D8DCC7; --ink-2:#A5B2AB; --line:#262B36;
  --club:#131721; --club-2:#232938; --on-club:#D8DBC7; --gold:#C9D786; --gold-soft:#464E1E; --input:#41491C; color-scheme:dark}
body::before{background:var(--night)}

/* hero */
header.top{position:relative;overflow:hidden;background:var(--night);color:#D8DBC7}
header.top .wrap{display:block;padding-block:16px 0}
.hrow{display:flex;align-items:center;gap:10px}
.kick{display:inline-flex;align-items:center;gap:8px;background:rgba(232,70,58,.14);border:1.5px solid #E8463A;color:#FFB3AB;font:800 12px var(--body);letter-spacing:1.8px;text-transform:uppercase;padding:5px 12px;border-radius:999px}
.kick .dot{width:8px;height:8px;border-radius:50%;background:#E8463A;box-shadow:0 0 0 4px rgba(232,70,58,.25);animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.4;transform:scale(.75)}}
header.top .upd{margin-left:auto;text-align:right;font-size:11px;letter-spacing:1px;text-transform:uppercase;opacity:.75}
header.top .upd b{display:block;font:800 16px var(--display);letter-spacing:.6px;color:var(--hi-2);text-transform:none}
.brand{display:flex;align-items:center;gap:14px;margin-top:16px}
header.top .brand .emb{width:64px;height:64px;border-radius:50%;flex:none;box-shadow:0 0 0 2px var(--hi),0 0 30px rgba(189,206,107,.35)}
.brand h1{margin:0;font:italic 900 clamp(40px,10vw,68px)/.86 var(--display);text-transform:uppercase;letter-spacing:.5px}
.brand h1 em{font-style:italic;color:var(--hi-2)}
.brand p{margin:6px 0 0;font:700 12px var(--body);letter-spacing:3px;text-transform:uppercase;color:#A4A9B9}
.scene-wrap{position:relative;margin-top:6px}
.scene{display:block;width:100%;height:clamp(250px,58vw,420px)}
.scene .pane{animation:flick 7s ease-in-out infinite}
@keyframes flick{0%,92%,100%{opacity:1}95%{opacity:.82}}
.scene .star{animation:tw 4s ease-in-out infinite}
@keyframes tw{50%{opacity:.1}}
.scene .ball{animation:hop 1.6s cubic-bezier(.4,0,.6,1) infinite}
@keyframes hop{50%{transform:translateY(-14px)}}
.scene .beam{animation:beam 5s ease-in-out infinite}
@keyframes beam{50%{opacity:.55}}
.scene-wrap::after{content:"";position:absolute;top:auto;right:0;bottom:0;left:0;height:14%;background:linear-gradient(transparent,var(--night))}
.hero-bar{position:relative;z-index:1;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-top:-6px;padding-bottom:18px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips span{font:700 11.5px var(--body);letter-spacing:1px;text-transform:uppercase;padding:5px 11px;border-radius:999px;border:1.5px solid rgba(216,219,199,.3);background:rgba(12,15,22,.6);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px)}
.chips span.g{border-color:var(--hi);color:var(--hi-2)}
.presented{display:inline-flex;align-items:center;gap:10px;background:#FFFFFF;border-radius:999px;padding:4px 5px 4px 14px;box-shadow:0 0 0 2px var(--hi),0 10px 24px rgba(0,0,0,.35)}
.presented span{font:800 10px var(--body);letter-spacing:1.8px;text-transform:uppercase;color:#1A2F6A}
header.top .presented img{height:34px;width:auto;border-radius:999px}

/* tabs */
nav.tabs{background:var(--night-2);box-shadow:0 1px 0 rgba(189,206,107,.35),0 8px 18px rgba(0,0,0,.18)}
nav.tabs .wrap{gap:6px;padding-block:8px}
nav.tabs button{font:italic 800 17px var(--display);letter-spacing:1px;text-transform:uppercase;color:#D8DBC7;opacity:.7;border:0;border-radius:999px;padding:8px 14px}
nav.tabs button[aria-selected="true"]{opacity:1;background:linear-gradient(180deg,var(--hi-2),var(--hi));color:#181C28;box-shadow:0 4px 14px rgba(189,206,107,.35)}

/* headings + cards */
.day h2,.sec h2{font-style:italic;font-weight:900;font-size:28px;position:relative;padding-left:16px}
.day h2::before,.sec h2::before{content:"";position:absolute;left:0;top:5px;bottom:5px;width:6px;border-radius:3px;background:linear-gradient(var(--hi-2),var(--club-2))}
.cat-head{font-style:italic;font-weight:900;position:relative;overflow:hidden}
.cat-head::after{content:"";position:absolute;top:0;right:0;bottom:0;left:0;background:repeating-linear-gradient(-62deg,rgba(255,255,255,.08) 0 2px,transparent 2px 18px);pointer-events:none}
.chip[aria-pressed="true"]{background:var(--club-2);border-color:var(--club-2);color:#D8DBC7}
.btn.primary{background:var(--club-2);border-color:var(--club-2);color:#D8DBC7}
.tbl h3,.champ b,.admin strong{font-style:italic}
.champ{background:linear-gradient(120deg,var(--night),var(--club-2));border:1px solid var(--hi);color:#D8DBC7}
.champ .cup{color:var(--hi-2)}
.m.final,.tile.final{border-color:var(--hi);box-shadow:0 0 0 2px rgba(189,206,107,.35)}
.brow.ev.award .evt{background:linear-gradient(120deg,var(--night),var(--club-2));color:var(--hi-2);font-style:italic}
.savebar{background:var(--night)}
.savebar .btn.primary{background:var(--hi);border-color:var(--hi);color:#181C28}
.dayb{border-radius:14px}
.dayb b{font-style:italic;font-weight:900}
.dayb[aria-selected="true"]{background:var(--night);border-color:var(--hi);color:#D8DBC7;box-shadow:0 4px 0 var(--hi)}
.dayb[aria-selected="true"] span{color:var(--hi-2)}
.bc{background:linear-gradient(var(--club-2),var(--club));font-style:italic;font-weight:900}
.bhd{top:calc(env(safe-area-inset-top,0px) + 52px)}
.now{border:2px solid var(--hi)}

/* sponsor village */
.village{position:relative;border-radius:18px;overflow:hidden;background:radial-gradient(120% 120% at 50% 0%,var(--club-2),var(--night) 70%);color:#D8DBC7;padding:14px 0 16px;box-shadow:0 0 0 1px rgba(189,206,107,.4)}
.village::before{content:"";position:absolute;top:auto;right:0;bottom:0;left:0;height:46px;background:repeating-linear-gradient(90deg,rgba(189,206,107,.12) 0 2px,transparent 2px 60px),linear-gradient(transparent,rgba(0,0,0,.25))}
.v-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding-inline:16px;margin-bottom:12px;position:relative}
.v-head h2{margin:0;font:italic 900 24px var(--display);text-transform:uppercase;letter-spacing:.6px}
.v-head h2 em{color:var(--hi-2);font-style:italic}
.v-head span{font:700 11px var(--body);letter-spacing:1.4px;text-transform:uppercase;opacity:.7}
.v-track{display:flex;gap:14px;width:max-content;animation:roll 38s linear infinite;padding-inline:8px;position:relative}
.village:hover .v-track{animation-play-state:paused}
@keyframes roll{to{transform:translateX(-50%)}}
.booth{width:132px;flex:none;display:flex;flex-direction:column;align-items:center}
.canopy{width:100%;height:30px;border-radius:6px 6px 0 0;background:repeating-linear-gradient(90deg,var(--a) 0 22px,var(--b) 22px 44px);position:relative;box-shadow:inset 0 4px 0 rgba(0,0,0,.18)}
.canopy::after{content:"";position:absolute;left:0;right:0;top:100%;height:11px;background:radial-gradient(circle at 11px 0,var(--a) 10.5px,transparent 11px) 0 0/44px 11px repeat-x,radial-gradient(circle at 11px 0,var(--b) 10.5px,transparent 11px) 22px 0/44px 11px repeat-x}
.posts{width:84%;height:12px;display:flex;justify-content:space-between}
.posts i{width:4px;background:#0A0C13}
.counter{width:100%;height:104px;border-radius:0 0 10px 10px;display:flex;align-items:center;justify-content:center;background:var(--c);box-shadow:inset 0 5px 0 var(--hi-2),0 10px 20px rgba(0,0,0,.3)}
.counter img.r{width:84px;height:84px;border-radius:50%;object-fit:cover;box-shadow:0 0 0 3px rgba(255,255,255,.8)}
.counter img.w{width:112px;max-height:56px;object-fit:contain;background:#FFFFFF;border-radius:8px;padding:4px}
.booth b{margin-top:8px;font:800 11px var(--body);letter-spacing:1.4px;text-transform:uppercase;white-space:nowrap}
@media (prefers-reduced-motion:reduce){.v-track{animation:none}.village{overflow-x:auto}.scene *{animation:none!important}.kick .dot{animation:none}}
@media (max-width:480px){header.top .brand .emb{width:52px;height:52px}.hero-bar{margin-top:-4px}header.top .presented img{height:28px}nav.tabs button{font-size:15px;padding:8px 10px}.bhd{top:calc(env(safe-area-inset-top,0px) + 49px)}.booth{width:116px}.counter{height:92px}.counter img.r{width:74px;height:74px}}

/* schedule tiles: page-coloured cells framed by a warm light strip */
.tile{background:var(--surface);color:var(--ink);border:1.5px solid #C8D684;border-left:5px solid var(--c);box-shadow:0 0 0 1px rgba(216,219,199,0.14),0 0 12px rgba(206,211,185,0.22),0 0 26px rgba(210,222,155,0.088),inset 0 0 10px rgba(211,214,192,0.072),0 8px 16px rgba(0,0,0,.18)}
.tile .tt{background:var(--surface-2)}
.tile.isdone{background:var(--surface-2);border-color:rgba(206,218,144,.55);box-shadow:0 0 8px rgba(206,211,185,.25),0 4px 10px rgba(0,0,0,.12)}
.tile.onlive{border-color:#FF6A5C;border-left-color:#E8463A;box-shadow:0 0 0 1px rgba(255,140,120,.4),0 0 14px rgba(232,70,58,.6),0 0 30px rgba(232,70,58,.25),inset 0 0 10px rgba(232,70,58,.15)}
.tile.final{border-color:#CFD3BA;border-left-color:var(--hi);box-shadow:0 0 0 1px rgba(216,219,199,.5),0 0 16px rgba(206,211,185,.7),0 0 34px rgba(210,222,155,.35),inset 0 0 12px rgba(211,214,192,.25)}
.tile.empty{box-shadow:none;border:1px dashed var(--line)}
.tm8 b{color:var(--gold);text-shadow:0 0 12px rgba(211,214,192,.35)}

/* groups + knockouts: same lit-frame language as the schedule */
.cat-head{background:linear-gradient(120deg,var(--night) 0%,#1B2131 70%,var(--night) 100%)!important;color:#D8DBC7;border:1.5px solid #CEDA90;border-radius:16px;padding:16px 18px;box-shadow:0 0 0 1px rgba(216,219,199,.35),0 0 14px rgba(206,211,185,.45),0 0 30px rgba(210,222,155,.18),inset 0 0 14px rgba(211,214,192,.12)}
.cat-head::after{background:
  linear-gradient(90deg,transparent 62%,rgba(255,255,255,.07) 62% calc(62% + 2px),transparent calc(62% + 2px)),
  linear-gradient(0deg,transparent 48%,rgba(255,255,255,.07) 48% calc(48% + 2px),transparent calc(48% + 2px)),
  linear-gradient(90deg,transparent 80%,rgba(255,255,255,.05) 80% calc(80% + 2px),transparent calc(80% + 2px))!important}
.cat-head small{color:var(--hi-2);opacity:1}
.tbl{background:var(--surface);border:1.5px solid #C8D684;border-radius:16px;box-shadow:0 0 0 1px rgba(216,219,199,0.12),0 0 12px rgba(206,211,185,0.18),0 0 26px rgba(210,222,155,0.064),inset 0 0 10px rgba(211,214,192,0.048),0 8px 16px rgba(0,0,0,.15)}
.tbl h3{background:linear-gradient(90deg,var(--night),var(--club-2));color:#D8DBC7;border-bottom:1.5px solid #CEDA90}

.tbl th{color:var(--gold)}

tr.q td{background:linear-gradient(90deg,rgba(211,214,192,.16),rgba(211,214,192,.03))}
tr.q td:first-child{box-shadow:inset 4px 0 0 #CEDA90,inset 10px 0 12px -6px rgba(211,214,192,.6)}
.pill{background:linear-gradient(180deg,var(--hi-2),var(--hi));color:#181C28;box-shadow:0 0 8px rgba(211,214,192,.6)}
.pill.tie{background:#E8463A;color:#FFFFFF;box-shadow:0 0 8px rgba(232,70,58,.6)}
.note{border:1px dashed rgba(206,218,144,.6);background:var(--surface)}
/* bracket */
.bx{background:var(--surface);border:1.5px solid #CEDA90;border-radius:12px;box-shadow:0 0 0 1px rgba(216,219,199,.3),0 0 10px rgba(206,211,185,.45),0 0 22px rgba(210,222,155,.15),inset 0 0 8px rgba(211,214,192,.12)}
.bh{background:linear-gradient(90deg,var(--night),var(--club-2));color:#A4A9B9}
.bh b{color:var(--hi-2)}
.bl.won{background:linear-gradient(90deg,rgba(211,214,192,.22),transparent);box-shadow:inset 3px 0 0 #CEDA90}
.bl.won .bs{color:var(--gold);text-shadow:0 0 8px rgba(211,214,192,.7)}
.ln{background:#CEDA90;opacity:.85;box-shadow:0 0 6px rgba(206,211,185,.8),0 0 14px rgba(210,222,155,.4)}
.bx.bf{border-color:#CFD3BA;box-shadow:0 0 0 1px rgba(216,219,199,.5),0 0 16px rgba(206,211,185,.75),0 0 36px rgba(210,222,155,.35),inset 0 0 12px rgba(211,214,192,.25)}
.bx.bf .bh b::before{content:"🏆 "}
.bx.onlive{border-color:#FF6A5C;box-shadow:0 0 0 1px rgba(255,140,120,.4),0 0 14px rgba(232,70,58,.6)}
.champ{box-shadow:0 0 0 1px rgba(216,219,199,.4),0 0 16px rgba(206,211,185,.6),0 0 34px rgba(210,222,155,.25)}
.team{border:1.5px solid rgba(206,218,144,.7);box-shadow:0 0 10px rgba(206,211,185,.25)}

/* readable names inside the lit cells */
:root{--name:#0D111A;--name-glow:none;--sep:rgba(153,172,57,.35)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--name:#D8DBC7;--name-glow:0 0 10px rgba(211,214,192,.28);--sep:rgba(206,218,144,.3)}}
:root[data-theme="dark"]{--name:#D8DBC7;--name-glow:0 0 10px rgba(211,214,192,.28);--sep:rgba(206,218,144,.3)}
.tile{padding:8px 10px;gap:3px}
.tile .tl{font:700 17.5px/1.15 var(--display);letter-spacing:.3px;color:var(--name);text-shadow:var(--name-glow)}
.tile .tl + .tl{border-top:1px dashed var(--sep);padding-top:4px}
.tile .tl.won{font-weight:800;color:var(--name)}
.tile .tl.lost{opacity:.6}

td.t .id{font:600 11px var(--body);letter-spacing:.5px;text-shadow:none}

/* ===== Core Night skin: Core Club green + gold, night-court hero, sponsor village ===== */
:root{

}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0B111D; --surface:#121A29; --surface-2:#172134; --ink:#EBEFD9; --ink-2:#A5B2AB; --line:#253148;
  --club:#101A2D; --club-2:#202F4B; --on-club:#F1F5E2; --gold:#C9E658; --gold-soft:#313816; --input:#2C3214; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0B111D; --surface:#121A29; --surface-2:#172134; --ink:#EBEFD9; --ink-2:#A5B2AB; --line:#253148;

body::before{background:var(--night)}

/* hero */
header.top{position:relative;overflow:hidden;background:var(--night);color:#F1F5E2}
header.top .wrap{display:block;padding-block:16px 0}
.hrow{display:flex;align-items:center;gap:10px}
.kick{display:inline-flex;align-items:center;gap:8px;background:rgba(232,70,58,.14);border:1.5px solid #E8463A;color:#FFB3AB;font:800 12px var(--body);letter-spacing:1.8px;text-transform:uppercase;padding:5px 12px;border-radius:999px}
.kick .dot{width:8px;height:8px;border-radius:50%;background:#E8463A;box-shadow:0 0 0 4px rgba(232,70,58,.25);animation:pulse 1.4s ease-in-out infinite}

.brand{display:flex;align-items:center;gap:14px;margin-top:16px}
header.top .brand .emb{width:64px;height:64px;border-radius:50%;flex:none;box-shadow:0 0 0 2px var(--hi),0 0 30px rgba(186,215,68,.35)}

.scene-wrap{position:relative;margin-top:6px}
.scene{display:block;width:100%;height:clamp(250px,58vw,420px)}
.scene .pane{animation:flick 7s ease-in-out infinite}

.scene .star{animation:tw 4s ease-in-out infinite}

.scene-wrap::after{content:"";position:absolute;top:auto;right:0;bottom:0;left:0;height:14%;background:linear-gradient(transparent,var(--night))}
.hero-bar{position:relative;z-index:1;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-top:-6px;padding-bottom:18px}

/* headings + cards */
.day h2,.sec h2{font-style:italic;font-weight:900;font-size:28px;position:relative;padding-left:16px}
.day h2::before,.sec h2::before{content:"";position:absolute;left:0;top:5px;bottom:5px;width:6px;border-radius:3px;background:linear-gradient(var(--hi-2),var(--club-2))}

.savebar{background:var(--night)}

.bc{background:linear-gradient(var(--club-2),var(--club));font-style:italic;font-weight:900}
.bhd{top:calc(env(safe-area-inset-top,0px) + 52px)}
.now{border:2px solid var(--hi)}

/* sponsor village */
.village{position:relative;border-radius:18px;overflow:hidden;background:radial-gradient(120% 120% at 50% 0%,var(--club-2),var(--night) 70%);color:#F1F5E2;padding:14px 0 16px;box-shadow:0 0 0 1px rgba(186,215,68,.4)}
.village::before{content:"";position:absolute;top:auto;right:0;bottom:0;left:0;height:46px;background:repeating-linear-gradient(90deg,rgba(186,215,68,.12) 0 2px,transparent 2px 60px),linear-gradient(transparent,rgba(0,0,0,.25))}
.v-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding-inline:16px;margin-bottom:12px;position:relative}

.booth{width:132px;flex:none;display:flex;flex-direction:column;align-items:center}

/* ---------- padel scoring engine ---------- */
/* kind: 6 = one set to 6 (tiebreak at 6-6), 9 = one set to 9 (tiebreak at 8-8), "sets" = best of 3 sets to 6, third set = super tiebreak to 10 */
function newPts(kind){ return { kind, sets: [], g: [0, 0], p: [0, 0], d: 0, tb: false, stb: false, done: false, win: null, n: 0 }; }
function clonePts(x){ return JSON.parse(JSON.stringify(x)); }

    st.sets.push(st.g.slice()); st.g = [0, 0]; st.tb = false;
    const w = setsWon(st);
    if (w[i] === 2){ st.done = true; st.win = i; }
    else if (w[0] === 1 && w[1] === 1){ st.stb = true; st.p = [0, 0]; }
  } else { st.done = true; st.win = i; }
}
function gameTo(st, i){
  st.p = [0, 0]; st.d = 0; st.g[i]++;
  const a = st.g[i], b = st.g[1 - i];
  if (st.tb){ finishSet(st, i); return; }
  if (st.kind === 9){
    if (a === 9){ finishSet(st, i); return; }
    if (a === 8 && b === 8) st.tb = true;
  } else {
    if (a >= 6 && a - b >= 2){ finishSet(st, i); return; }
    if (a === 6 && b === 6) st.tb = true;
  }
}
function pointTo(st0, i){
  const st = clonePts(st0); if (st.done) return st; st.n++;
  if (st.stb){
    st.p[i]++;
    if (st.p[i] >= 10 && st.p[i] - st.p[1 - i] >= 2){ st.sets.push([st.p[0], st.p[1]]); st.stb = false; st.stbScore = st.p.slice(); st.p = [0, 0]; st.done = true; st.win = i; }
    return st;
  }
  if (st.tb){
    st.p[i]++;
    if (st.p[i] >= 7 && st.p[i] - st.p[1 - i] >= 2) gameTo(st, i);
    return st;
  }
  const [a, b] = st.p;
  if (a === b && a >= 3 && st.d >= 2){ gameTo(st, i); return st; }        /* golden point */
  st.p[i]++;
  if (st.p[0] === st.p[1] && st.p[0] >= 3) st.d++;                          /* reached deuce */

/* ---------- check-in pass (player) and desk (organizer) ---------- */
var CI = { pass: null, desk: null, open: false, res: null, f: "all", q: "" };
async function loadPass(){ try { const r = await sb.rpc("t_my_pass", {p_slug: SLUG}); CI.pass = r.error ? null : r.data; } catch (e) {} }
async function loadDesk(){ try { const r = await sb.rpc("t_desk", {p_slug: SLUG}); CI.desk = r.error ? null : r.data; } catch (e) {} }
const feeTxt = f => f ? `$${(+f).toLocaleString("en-US")}` : "";
function passBox(){ const p = CI.pass; if (!p || p.status !== "confirmed" || editMode) return "";
  return `<section class="sec pass"><h2>Your entry pass <small>${p.paid ? "Paid, see you on court" : "Show it at the desk when you pay"}</small></h2>
    <div class="pass-card"><div class="pass-q">${qrSvg("PLT:" + p.id)}</div>
    <div class="pass-i"><b>${esc(p.team)}</b><span class="su-s">${esc(CATN[p.cat] || p.cat)}${p.slot && !drawPend() ? ` · Team ${esc(p.slot)}` : ""}</span>
    <span class="pass-code">Code <b dir="ltr">${esc(p.code || "")}</b></span>
    <span class="tag ${p.paid ? "ok" : "due"}">${p.paid ? "✓ Paid" : `Pay at the desk${p.fee ? " · " + feeTxt(p.fee) : ""}`}</span></div></div></section>`; }
function ciAttach(){ const v = document.getElementById("ciVid"); if (!v || CI.res) return; if (ciStream){ if (v.srcObject !== ciStream){ v.srcObject = ciStream; v.play().catch(() => {}); } } else ciStart(); }
function deskBox(){ if (!CI.open || !CI.desk) return ""; setTimeout(ciAttach, 0);
  const L = CI.desk, paid = L.filter(x => x.paid).length, inn = L.filter(x => x.in).length, r = CI.res, q = CI.q.trim().toLowerCase();
  const list = L.filter(x => (CI.f === "all" || (CI.f === "unpaid" && !x.paid) || (CI.f === "paid" && x.paid)) && (!q || [x.team, x.p1, x.p2, x.code, x.slot].join(" ").toLowerCase().includes(q)));
  const fee = +CFG.fee || 0;
  return `<section class="sec desk"><h2>Payments desk <small>Paid ${paid} of ${L.length} teams${fee ? ` · Collected $${(paid * fee).toLocaleString("en-US")} of ${feeTxt(L.length * fee)}` : ""}</small></h2>
    ${r ? `<div class="ci-res ${r.paid ? "ok" : "again"}"><span class="ci-big">${r.paid ? "✓" : "💵"}</span><b>${r.paid ? "Paid" : "Not paid yet"}</b>
      <span class="ci-who">${esc(r.team)}</span><span class="su-s">${esc(CATN[r.cat] || r.cat)}${r.slot ? ` · Team ${esc(r.slot)}` : ""} · ${esc(r.p1 || "")} + ${esc(r.p2 || "")}</span>
      ${r.paid ? "" : `${r.fee ? `<span class="ci-due">To pay: <b>${feeTxt(r.fee)}</b></span>` : ""}<button class="btn primary" data-cipaid="${r.id}">💵 Mark as paid (cash)</button>`}
      <button class="btn" data-cinext>Scan next team</button></div>`
    : `<div class="ci-cam">${"BarcodeDetector" in window ? `<video id="ciVid" playsinline muted></video><i class="ci-frame"></i>` : `<p class="su-s">This browser can't scan. Type the team's 4-digit code instead.</p>`}</div>
      <div class="ci-code"><input id="ci-code" inputmode="numeric" maxlength="4" placeholder="4-digit code" dir="ltr"><button class="btn primary" data-cigo>Find</button></div>`}
    <div class="su-cats"><button class="chip" data-cif="all" aria-pressed="${CI.f === "all"}">All ${L.length}</button><button class="chip" data-cif="paid" aria-pressed="${CI.f === "paid"}">Paid ${paid}</button><button class="chip" data-cif="unpaid" aria-pressed="${CI.f === "unpaid"}">Not paid ${L.length - paid}</button></div>
    <input id="ci-q" class="ci-q" placeholder="Search a team, player or code" value="${esc(CI.q)}">
    <div class="desk-l">${list.map(x => `<div class="desk-r"><div><b>${esc(x.team)}</b><span class="su-s">${esc(CATN[x.cat] || x.cat)}${x.slot ? ` · ${esc(x.slot)}` : ""} · code ${esc(x.code || "")}</span><span class="su-s">${esc(x.p1)} + ${esc(x.p2)}</span></div>
      <div class="desk-b"><button class="chip${x.paid ? " on" : ""}" data-dpaid="${x.id}|${x.paid ? 0 : 1}">${x.paid ? "✓ Paid" : "💵 Not paid"}</button></div></div>`).join("") || `<p class="su-s">No teams.</p>`}</div></section>`; }
var ciStream = null, ciTimer = null;
function ciStop(){ if (ciTimer){ clearInterval(ciTimer); ciTimer = null; } if (ciStream){ ciStream.getTracks().forEach(x => x.stop()); ciStream = null; } }
var ciBusy = false;
async function ciStart(){ if (ciBusy) return; ciStop(); const v = document.getElementById("ciVid"); if (!v || !("BarcodeDetector" in window)) return; ciBusy = true;
  try { ciStream = await navigator.mediaDevices.getUserMedia({video: {facingMode: "environment"}}); v.srcObject = ciStream; await v.play();
    const det = new BarcodeDetector({formats: ["qr_code"]}); ciBusy = false;
    ciTimer = setInterval(async () => { if (!CI.open || CI.res){ ciStop(); return; } try { const vv = document.getElementById("ciVid") || v; const c = await det.detect(vv); if (c && c[0] && c[0].rawValue){ ciStop(); ciDo(c[0].rawValue); } } catch (e) {} }, 350);
  } catch (e) { ciBusy = false; const box = document.querySelector(".ci-cam"); if (box) box.innerHTML = `<p class="su-s">Camera not available. Type the team's 4-digit code instead.</p>`; } }
async function ciDo(key){ const r = await sb.rpc("t_checkin", {p_slug: SLUG, p_key: key}); if (r.error){ alertMsg(r.error.message); ciStart(); return; }
  CI.res = r.data; try { navigator.vibrate && navigator.vibrate(80); } catch (e) {} await loadDesk(); render(); }
function alertMsg(m){ status = m; render(); setTimeout(() => { if (status === m){ status = ""; render(); } }, 4000); }
document.addEventListener("click", async e => { const el = e.target.closest("[data-ciopen],[data-cinext],[data-cigo],[data-cipaid],[data-cif],[data-dpaid],[data-din]"); if (!el) return; const d = el.dataset;
  if ("ciopen" in d){ CI.open = !CI.open; CI.res = null; if (CI.open){ await loadDesk(); render(); setTimeout(ciStart, 150); } else { ciStop(); render(); } return; }
  if ("cinext" in d){ CI.res = null; render(); setTimeout(ciStart, 150); return; }
  if ("cigo" in d){ const v = (document.getElementById("ci-code") || {}).value || ""; if (v.replace(/\D/g, "").length < 4) return; ciStop(); ciDo(v); return; }
  if (d.cipaid){ const r = await sb.rpc("t_set_paid", {p_entry: d.cipaid, p_paid: true}); if (r.error){ alertMsg(r.error.message); return; } CI.res.paid = true; await loadDesk(); render(); return; }
  if (d.cif){ CI.f = d.cif; render(); return; }
  if (d.dpaid){ const [id, v] = d.dpaid.split("|"); const r = await sb.rpc("t_set_paid", {p_entry: id, p_paid: v === "1"}); if (r.error){ alertMsg(r.error.message); return; } await loadDesk(); render(); return; }
  if (d.din){ const [id, v] = d.din.split("|"); const r = await sb.rpc("t_set_checkin", {p_entry: id, p_in: v === "1"}); if (r.error){ alertMsg(r.error.message); return; } await loadDesk(); render(); return; }
});
document.addEventListener("input", e => { if (e.target.id === "ci-q"){ CI.q = e.target.value; const pos = e.target.selectionStart; render(); const n = document.getElementById("ci-q"); if (n){ n.focus(); try { n.setSelectionRange(pos, pos); } catch (x) {} } } });
function suWhy(){ const fee = CFG.fee ? +CFG.fee : 0, prize = (CFG.facts || []).map(String).find(x => /prize/i.test(x)), amt = prize ? (prize.match(/\$[\d,]+/) || [""])[0] : "";
  const tot = +String(amt).replace(/[^\d.]/g, ""), sp = Array.isArray(CFG.prize_split) && CFG.prize_split.length ? CFG.prize_split.map(Number) : [70, 30];
  const per = tot > 0 && CATS.length ? Math.round(tot / CATS.length) : 0, money = v => "$" + Math.round(v).toLocaleString("en-US");
  const fmt = (FORMAT[CATS[0]] || ""), d0 = Object.keys(DAYS).length;
  return `<div class="su-why"><div class="su-why-r">
    <div class="su-w"><small>Entry</small><b>${fee ? "$" + fee : "At the desk"}</b><span>${fee ? "per team · pay at the desk" : "pay when you check in"}</span></div>
    ${per ? `<div class="su-w hot"><small>Prize per category</small><b>${money(per)}</b><span>🥇 ${money(per * sp[0] / 100)} · 🥈 ${money(per * (sp[1] || 0) / 100)}</span></div>` : ""}</div>
    <ul class="su-why-l"><li>${d0} day${d0 > 1 ? "s" : ""} · group matches, then knockouts to the final</li><li>Teams play in their level category</li><li>Live scores, your schedule and the draw on your phone</li></ul></div>`; }
function suPill(){ const I = SU.info; if (!I || editMode || !I.open || (I.mine && (I.mine.status === "pending" || I.mine.status === "confirmed"))) return "";
  return `<button class="su-pill" data-gosignup><span class="su-pill-d"></span><b>Sign up your team</b><small>Closes the day before</small><span class="su-pill-go">→</span></button>`; }
document.addEventListener("click", e => { if (!e.target.closest("[data-gosignup]")) return; view.tab = "info"; try { history.replaceState(null, "", "#info"); } catch (x) {} render(); setTimeout(() => { const el = document.querySelector(".su"), nv = document.querySelector("nav.tabs"); if (el) window.scrollTo({top: el.getBoundingClientRect().top + scrollY - (nv ? nv.getBoundingClientRect().height : 0) - 12, behavior: "smooth"}); }, 60); });
function signupBox(){ const I = SU.info; if (!I || editMode) return "";

  let h = "";
  if (I.open || mine){
    h += `<section class="sec su"><h2>Team sign-up ${I.open ? `<small>Open until the day before the tournament</small>` : ""}</h2>`;
    if (!I.signed && I.open && !SU.open) h += suWhy() + `<button class="btn primary su-go" data-suopen>Sign up your team →</button>`;

    else if (mine){ const ok = mine.status === "confirmed", fee = CFG.fee ? +CFG.fee : 0;
      h += `<div class="su-in${ok ? " ok" : ""}"><div class="su-in-h"><i>${ok ? "✅" : "⏳"}</i><div><b>${ok ? "You're in!" : "Request sent!"}</b><span>${esc(mine.team)} · ${esc(CATN[mine.cat] || mine.cat)}${mine.slot && !drawPend() && !preTeams() ? ` · Team ${esc(mine.slot)}` : ""}</span></div></div>
        <ol class="su-next"><li class="${ok ? "sn-done" : "sn-now"}"><b>${ok ? "Confirmed by the organizer" : "The organizer confirms your team"}</b><span>${ok ? "Your place is saved." : "You'll get a notification as soon as it's confirmed."}</span></li>
        <li class="${ok ? "sn-now" : ""}"><b>${drawOn() ? "Watch the live draw" : "Check your matches"}</b><span>${drawOn() ? "See which group you land in, live." : "Your times show on the Schedule after sign-up closes."}</span></li>
        <li><b>Pay at the desk${fee ? ` · $${fee}` : ""}</b><span>Show your entry pass (QR) when you check in. If you don't pay, you don't play.</span></li></ol>
        ${I.open ? `<button class="btn small" data-suwd>Withdraw</button>` : ""}</div>`; }
    else if (I.open && SU.myInv) h += suWaiting();
    else if (I.open && !SU.open) h += suWhy() + `<button class="btn primary su-go" data-suopen>Sign up your team →</button>${I.mine && I.mine.status === "rejected" ? `<p class="su-s">Your last request was not accepted. You can sign up again.</p>` : ""}`;
    else if (I.open){
      const ck = SU.check;
      const inv = SU.pmode !== "acc";
      h += `<div class="su-form">
        <p class="su-step">Step 2 of 2 · Your team</p>
        <span class="lbl">Your category</span><div class="su-cats">${CATS.map(k => `<button class="chip" data-sucat="${k}" aria-pressed="${SU.cat === k}">${esc(CATN[k] || k)}${CATR[k] ? ` <small>${CATR[k]}</small>` : ""}</button>`).join("")}</div>${SU.cat === "X" ? `<p class="su-s">Mixed: one man and one woman, any level. The organizer checks every mixed team.</p>` : ""}
        ${!CFG.level_check ? `<p class="su-s">🔓 Open entry: pick the category you want to play. The organizer confirms every team. No rank yet? You get this category as your rank and your tier card as soon as your team is confirmed.</p>` : !SU.info.level || SU.autoLv ? `<p class="su-s">Your first matches fine-tune your level. B and A players are checked by the admin.</p>` : ""}
        <span class="lbl">Who's your partner?</span>
