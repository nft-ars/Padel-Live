/* ---------- padel scoring engine ---------- */
/* kind: 6 = one set to 6 (tiebreak at 6-6), 9 = one set to 9 (tiebreak at 8-8), "sets" = best of 3 sets to 6, third set = super tiebreak to 10 */
function newPts(kind){ return { kind, sets: [], g: [0, 0], p: [0, 0], d: 0, tb: false, stb: false, done: false, win: null, n: 0 }; }
function clonePts(x){ return JSON.parse(JSON.stringify(x)); }
function setsWon(st){ const w = [0, 0]; for (const s of st.sets) w[s[0] > s[1] ? 0 : 1]++; return w; }
function finishSet(st, i){
  if (st.kind === "sets"){
    st.sets.push(st.g.slice()); st.g = [0, 0]; st.tb = false;
    const w = setsWon(st);
    if (w[i] === 2){ st.done = true; st.win = i; }
    else if (w[0] === 1 && w[1] === 1){ st.stb = true; st.p = [0, 0]; }
  } else { st.done = true; st.win = i; }
}
function gameTo(st, i){
  st.p = [0, 0]; st.d = 0; st.g[i]++;
  const a = st.g[i], b = st.g[1 - i];
  if (st.tb){ finishSet(st, i); return; }
  if (st.kind === 9){
    if (a === 9){ finishSet(st, i); return; }
    if (a === 8 && b === 8) st.tb = true;
  } else {
    if (a >= 6 && a - b >= 2){ finishSet(st, i); return; }
    if (a === 6 && b === 6) st.tb = true;
  }
}
function pointTo(st0, i){
  const st = clonePts(st0); if (st.done) return st; st.n++;
  if (st.stb){
    st.p[i]++;
    if (st.p[i] >= 10 && st.p[i] - st.p[1 - i] >= 2){ st.sets.push([st.p[0], st.p[1]]); st.stb = false; st.stbScore = st.p.slice(); st.p = [0, 0]; st.done = true; st.win = i; }
    return st;
  }
  if (st.tb){
    st.p[i]++;
    if (st.p[i] >= 7 && st.p[i] - st.p[1 - i] >= 2) gameTo(st, i);
    return st;
  }
  const [a, b] = st.p;
  if (a === b && a >= 3 && st.d >= 2){ gameTo(st, i); return st; }        /* golden point */
  st.p[i]++;
  if (st.p[0] === st.p[1] && st.p[0] >= 3) st.d++;                          /* reached deuce */
  if (st.p[i] >= 4 && st.p[i] - st.p[1 - i] >= 2) gameTo(st, i);
  return st;
}
function ptsLabel(st){
  if (!st || st.done) return null;
  if (st.tb || st.stb) return [String(st.p[0]), String(st.p[1])];
  const [a, b] = st.p, L = ["0", "15", "30", "40"];
  if (a >= 3 && b >= 3){ if (a === b) return ["40", "40"]; return a > b ? ["AD", "40"] : ["40", "AD"]; }
  return [L[Math.min(a, 3)], L[Math.min(b, 3)]];
}
function ptsNote(st){
  if (!st || st.done) return "";
  if (st.stb) return "Super tiebreak to 10";
  if (st.tb) return "Tiebreak to 7";
  const [a, b] = st.p; if (a === b && a >= 3) return st.d >= 2 ? "Golden point" : "Deuce";
  return "";
}
function setsText(st){ return st.sets.map((s, k) => st.kind === "sets" && k === 2 ? `[${s[0]}-${s[1]}]` : `${s[0]}-${s[1]}`).join(" "); }
function finalOf(st){ if (!st.done) return null; return st.kind === "sets" ? setsWon(st) : st.g.slice(); }
function liveTxt(id){
  const st = (cur().pts || {})[id]; if (!st || st.done) return "";
  const lab = ptsLabel(st), parts = [];
  if (st.kind === "sets" && st.sets.length) parts.push(setsText(st));
  parts.push(st.stb ? `STB ${st.p[0]}-${st.p[1]}` : `${st.g[0]}-${st.g[1]}`);
  if (!st.stb && lab && (st.n > 0)) parts.push(st.tb ? `TB ${lab[0]}-${lab[1]}` : `${lab[0]}-${lab[1]}`);
  return parts.join(" · ");
}
function doneTxt(id){ const st = (cur().pts || {})[id]; return st && st.done && st.kind === "sets" ? setsText(st) : ""; }

/* ---------- shared bits for referee + TV ---------- */
const MODE = (() => { try { const h = location.hash.replace("#", ""); return h === "ref" || h === "tv" ? h : ""; } catch (e) { return ""; } })();
const PINKEY = "pl-refpin-" + SLUG, CTKEY = "pl-refct-" + SLUG;
const lsGet = k => { try { return localStorage.getItem(k) || ""; } catch (e) { return ""; } };
const lsSet = (k, v) => { try { if (v) localStorage.setItem(k, v); else localStorage.removeItem(k); } catch (e) {} };
const sideName = x => x.id ? label(x.id) : (x.ph || "TBD");
const tm = t => String(t || "").replace(/^0/, "");
const isDoneM = m => m.w !== null && m.w !== undefined && m.A.id && m.B.id;

/* ---------- referee ---------- */
const REF = { pin: lsGet(PINKEY), court: +lsGet(CTKEY) || 0, mid: "", hist: {}, pending: null, sending: false, msg: "", checking: false };
function refMatches(){ return allMatches().filter(m => m.court === REF.court && m.A.id && m.B.id && !isDoneM(m)); }
function refCurrent(){
  if (REF.mid){ const m = allMatches().find(x => x.id === REF.mid && x.court === REF.court); if (m) return m; }
  const list = refMatches(); if (!list.length) return null;
  return list.find(m => isLive(m.id)) || list[0];
}
async function refSend(mid, st){
  REF.pending = { mid, st }; if (REF.sending) return; REF.sending = true;
  while (REF.pending){
    const job = REF.pending; REF.pending = null;
    try {
      const r = await sb.rpc("t_ref_update", { p_slug: SLUG, p_pin: REF.pin, p_mid: job.mid, p_pts: job.st, p_final: finalOf(job.st) });
      if (r.error) throw r.error;
      VERSION = r.data; REF.msg = ""; if (window.__rtBump) window.__rtBump(VERSION); if (finalOf(job.st)) setTimeout(() => syncResults(REF.pin), 500);
    } catch (e) {
      const m = (e && e.message) || "";
      if (/PIN/.test(m)){ REF.msg = "The referee PIN changed. Enter the new one."; lsSet(PINKEY, ""); REF.pin = ""; REF.pending = null; break; }
      REF.msg = "Not sent yet, retrying… (check the internet)"; if (!REF.pending) REF.pending = job;
      render(); await new Promise(res => setTimeout(res, 3000));
    }
  }
  REF.sending = false; render();
}
function refApply(mid, st){
  const s = cur(); s.pts = s.pts || {}; s.pts[mid] = st;
  const fin = finalOf(st);
  if (fin){ s.scores[mid] = fin; s.live = s.live.filter(x => x !== mid); }
  else { delete s.scores[mid]; if (!s.live.includes(mid)) s.live.push(mid); }
  render(); refSend(mid, st);
}
/* keep the referee's screen awake while a PIN is entered */
let refLock = null, refLockOn = false;
async function refWake(on){ refLockOn = on;
  try { if (on && !refLock && navigator.wakeLock && document.visibilityState === "visible"){ refLock = await navigator.wakeLock.request("screen"); refLock.addEventListener("release", () => { refLock = null; }); }
        else if (!on && refLock){ await refLock.release(); refLock = null; } } catch (e) { refLock = null; } }
document.addEventListener("visibilitychange", () => { if (refLockOn && document.visibilityState === "visible") refWake(true); });
function renderRef(){
  const app = document.getElementById("app"); document.body.classList.add("refmode"); refWake(!!REF.pin);
  const head = `<header class="rf-top"><div><b>Referee</b><span>${esc(TNAME)}</span></div>${REF.pin ? `<button class="rf-link" data-rf="out">Log out</button>` : ""}</header>`;
  if (!REF.pin){
    app.innerHTML = head + `<main class="rf"><form id="rfPin" class="rf-card"><h2>Enter the referee PIN</h2><p>The organizer gives you a 6-digit PIN for this tournament.</p>

      <button class="rf-big" type="submit"${REF.checking ? " disabled" : ""}>Continue</button>${REF.msg ? `<p class="rf-msg">${esc(REF.msg)}</p>` : ""}</form></main>`;
    return;
  }
  if (!REF.court){
    app.innerHTML = head + `<main class="rf"><div class="rf-card"><h2>Which court are you on?</h2><div class="rf-courts">${COURTS.map(c => `<button class="rf-court" data-rfct="${c}">${cname(c)}</button>`).join("")}</div></div></main>`;
    return;
  }
  const m = refCurrent();

  if (!m){ app.innerHTML = head + `<main class="rf">${courtBar}<div class="rf-card"><h2>No more matches on this court</h2><p>When the next matches are known, they appear here by themselves.</p></div></main>`; return; }
  const st0 = (cur().pts || {})[m.id];
  const kind = m.kind === "sets" ? "sets" : m.kind === 9 ? 9 : 6;
  const st = st0 && st0.kind === kind ? st0 : null;
  const others = refMatches().filter(x => x.id !== m.id).slice(0, 4);
  const fmtLine = kind === "sets" ? "Best of 3 · super tiebreak to 10" : kind === 9 ? "1 set to 9 · tiebreak at 8-8" : "1 set to 6 · tiebreak at 6-6";
  let body;
  if (!st){
    body = `<div class="rf-card rf-match"><span class="tag" style="background:${cvar(m.cat, 1)};color:${cvar(m.cat)}">${esc(m.tag)}</span><p class="rf-when">${esc(DSHORT[m.day])} · not before ${esc(tm(m.time))}</p>
      <div class="rf-vs"><b>${esc(sideName(m.A))}</b><i>vs</i><b>${esc(sideName(m.B))}</b></div><p class="rf-fmt">${fmtLine} · golden point after one deuce</p>
      <button class="rf-big" data-rf="start" data-mid="${m.id}">Start match</button></div>`;
  } else {
    const lab = ptsLabel(st) || ["", ""], note = ptsNote(st), sw = setsWon(st);
    const team = i => {

        ${st.done ? "" : `<span class="rf-plus">+ point</span>`}</button>`;
    };
    body = `<div class="rf-card rf-match"><div class="rf-mh"><span class="tag" style="background:${cvar(m.cat, 1)};color:${cvar(m.cat)}">${esc(m.tag)}</span><span class="rf-fmt">${fmtLine}</span></div>

  }
  const up = others.length ? `<div class="rf-card"><h3>Also on this court</h3>${others.map(x => `<button class="rf-other" data-rf="pick" data-mid="${x.id}"><span>${esc(DSHORT[x.day])} ${esc(tm(x.time))}</span><b>${esc(sideName(x.A))} vs ${esc(sideName(x.B))}</b></button>`).join("")}</div>` : "";
  app.innerHTML = head + `<main class="rf">${courtBar}${REF.msg ? `<p class="rf-msg">${esc(REF.msg)}</p>` : ""}${body}${up}</main>`;

document.addEventListener("submit", async e => {
  if (!e.target || e.target.id !== "rfPin") return; e.preventDefault();
  const v = (document.getElementById("rf-pin").value || "").trim();
  if (!/^\d{6}$/.test(v)){ REF.msg = "The PIN is 6 digits."; render(); return; }
  REF.checking = true; REF.msg = ""; render();
  try { const r = await sb.rpc("t_ref_check", { p_slug: SLUG, p_pin: v }); if (r.data === true){ REF.pin = v; lsSet(PINKEY, v); } else REF.msg = "That PIN isn't right. Ask the organizer."; }
  catch (x) { REF.msg = "Can't check the PIN right now. Check the internet."; }

document.addEventListener("click", e => {
  if (MODE !== "ref") return;
  const b = e.target.closest("[data-rf],[data-rfct]"); if (!b) return;
  if (b.dataset.rfct){ REF.court = +b.dataset.rfct; lsSet(CTKEY, String(REF.court)); REF.mid = ""; render(); return; }
  const a = b.dataset.rf, mid = b.dataset.mid;

  if (a === "court"){ REF.court = 0; lsSet(CTKEY, ""); render(); return; }

  if (a === "undo"){ const h = REF.hist[mid] || []; if (h.length) refApply(mid, h.pop()); return; }

/* ---------- TV (broadcast style) ---------- */
const TVS = { i: 0, last: "", timer: null, prev: {}, burstT: null, ticker: "" };
function tvPanels(){
  const all = allMatches(), p = [];
  const anyLive = COURTS.some(c => all.some(m => m.court === c && isLive(m.id) && !isDoneM(m)));
  p.push({ id: "courts", dur: anyLive ? 22000 : 12000 });
  if (all.some(m => notStarted(m))) p.push({ id: "next", dur: 11000 });
  for (const c of CATS) if (all.some(m => m.cat === c && !m.id.includes("-"))) p.push({ id: "grp-" + c, dur: GROUPS[c] > 4 ? 13000 : 11000 });
  if (all.some(isDoneM)) p.push({ id: "results", dur: 11000 });
  if (SPONSORS.length) p.push({ id: "sponsors", dur: 10000 });
  return p;
}
function threat(st){ /* who is one point from winning the set / match */
  if (!st || st.done) return null;
  for (const i of [0, 1]){
    const nx = pointTo(st, i);
    if (nx.done) return { i, what: "Match point" };
    if (st.kind === "sets" && nx.sets.length > st.sets.length) return { i, what: "Set point" };
  }
  return null;
}
function tvCourt(all, c){
  const d = cur().delay || {};
  const live = all.find(m => m.court === c && isLive(m.id) && !isDoneM(m));
  const next = all.find(m => m.court === c && notStarted(m) && (!live || m.id !== live.id));
  let h = `<div class="tv-court${live ? " is-live" : ""}" style="--cat:${cvar(live ? live.cat : (next ? next.cat : CATS[0]))}"><div class="tv-cin">`;
  h += `<div class="tv-ch"><h3>${cname(c)}</h3>${+d[c] > 0 ? `<span class="tv-late">Running ${+d[c]} min late</span>` : ""}${live ? `<span class="tv-onair"><span class="tv-dot"></span>Live</span>` : ""}</div>`;
  if (live){
    const st = (cur().pts || {})[live.id], lab = st ? ptsLabel(st) : null, sw = st ? setsWon(st) : [0, 0], th = threat(st), note = st ? ptsNote(st) : "";

let VERSION = VER0, EDITV = EDITV0;
async function save(){

  for (const [k, v] of Object.entries(draft.names)) if (v && v.trim()) clean.names[k] = v.trim();
  for (const [k, v] of Object.entries(draft.scores)) if (Array.isArray(v) && v.every(x => Number.isInteger(x))) clean.scores[k] = v;
  for (const [k, v] of Object.entries(draft.flags)) if (v && (v.t === "wo" || v.t === "ret") && (v.w === 0 || v.w === 1)) clean.flags[k] = v;
  for (const c of COURTS) if (+draft.delay[c] > 0) clean.delay[c] = +draft.delay[c];
  const prev = S; S = clean;
  const done = new Set(allMatches().filter(m => m.w !== null && m.w !== undefined && m.A.id && m.B.id).map(m => m.id));
  clean.live = draft.live.filter(id => !done.has(id)); S = prev;

    if (r.error) throw r.error;
    EDITV = r.data; VERSION = -1; S = clean; draft = null; setTimeout(() => pull(true), 300); editMode = false; status = "Published. Everyone's page updates within a few seconds.";
  } catch (err) {

    else status = /staff/.test(msg) ? "This account can't edit this tournament." : "Couldn't save right now. Your changes are still here; try again.";
  }
  busy = false; render();
}

    if (r.error || !r.data) return;
    if (r.data.edit_version) EDITV = r.data.edit_version; if (r.data.state && r.data.version !== VERSION || force){ if (r.data.state){ S = norm(r.data.state); VERSION = r.data.version; } if (!editMode) render(); }

}

        <p class="su-s su-rule">Rule: the team level (average of both players) must be inside the category, and the stronger player can be at most one category above it. Playing up is always allowed. New players count at the level they told us until their first 5 matches are played.</p>
        <div class="su-act"><button class="btn primary" data-susend${SU.busy || !ck || !ck.ok ? " disabled" : ""}>${SU.busy ? "…" : ck && ck.ok && !ck.fits ? "Send request" : "Sign up"}</button><button class="btn" data-suclose>Cancel</button></div>
        ${SU.msg ? `<p class="su-bad">${esc(SU.msg)}</p>` : ""}</div>`;
    }
    h += `</section>`;
  }
  if (I.org && I.entries && I.entries.length){
    const cats = [...new Set(I.entries.map(e => e.cat))], oc = SU.orgCat && cats.includes(SU.orgCat) ? SU.orgCat : "";
    const list = I.entries.filter(e => !oc || e.cat === oc), pend = I.entries.filter(e => e.status === "pending").length;
    h += `<section class="sec su org"><h2>Organizer · Entries <small>${pend} waiting</small></h2>
      <div class="su-cats"><button class="chip" data-suocat="" aria-pressed="${!oc}">All</button>${cats.map(k => `<button class="chip" data-suocat="${k}" aria-pressed="${oc === k}">${esc(CATN[k] || k)}</button>`).join("")}</div>
      ${list.map(e => `<div class="su-row${e.status === "pending" ? " pend" : ""}"><div><b>${esc(e.team)}</b> <span class="su-s">${esc(CATN[e.cat] || e.cat)}${e.slot ? ` · ${esc(e.slot)}` : ""}</span>
          <span class="su-s">${esc(e.p1.n)} ${(+e.p1.l).toFixed(2)} + ${esc(e.p2.n)} ${(+e.p2.l).toFixed(2)} · avg ${(+e.avg).toFixed(2)}${e.fits ? "" : ` · <b class="su-badt">outside the rule</b>`}</span>
          <span class="su-s" dir="ltr">${esc(e.p1.ph || "")}${e.p2.ph ? " · " + esc(e.p2.ph) : ""}</span>${e.note ? `<span class="su-note">“${esc(e.note)}”</span>` : ""}</div>
        <div class="su-btns">${e.status === "pending" ? `<button class="btn small primary" data-suset="${e.id}" data-sust="confirmed">Confirm</button><button class="btn small" data-suset="${e.id}" data-sust="rejected">Reject</button>`
          : `<span class="tag">${e.status === "confirmed" ? "✓ In" : "Rejected"}</span>${e.status === "confirmed" ? `<button class="btn small" data-suset="${e.id}" data-sust="rejected">Remove</button>` : ""}`}</div></div>`).join("")}
      <p class="su-s">Confirmed teams go into the first empty place of their category (Group 1 first). To move a team, use Enter scores and edit the names.</p></section>`;
  }
  return h;
}
document.addEventListener("click", async e => {
  const b = e.target.closest("button"); if (!b) return; const d = b.dataset;
  if ("suopen" in d){ SU.open = true; SU.msg = ""; render(); return; }
  if ("sumode" in d){ SU.auth = SU.auth === "up" ? "in" : "up"; SU.msg = ""; render(); return; }
  if ("suauth" in d){ const pass = (document.getElementById("su-apass") || {}).value || ""; SU.busy = true; SU.msg = ""; render();
    let em = SU.aPhone.trim(), r = null;
    if (SU.auth === "up"){ const ps = await sb.rpc("phone_signup", {p_name: SU.aName.trim(), p_phone: em, p_pass: pass}); if (ps.error) r = ps; else em = ps.data; }
    else if (!em.includes("@")){ const pl = await sb.rpc("phone_login", {p_phone: em, p_pass: pass}); if (pl.error) r = pl; else if (!pl.data) r = {error: {message: "Wrong phone number or password."}}; else em = pl.data; }
    if (!r) r = await sb.auth.signInWithPassword({email: em, password: pass});
    SU.busy = false; if (r.error){ SU.msg = r.error.message; render(); return; }
    SU.open = true; await loadSU(); return; }
  if ("suinv" in d){ const r = await sb.rpc("t_invite_create", {p_slug: SLUG, p_cat: SU.cat, p_note: SU.note || null}); if (r.error){ SU.msg = r.error.message; render(); return; }
    const url = location.origin + location.pathname.replace(/[^/]*$/, "") + "?tjoin=" + r.data, msg = "Be my partner in " + TNAME + " (" + (CATN[SU.cat] || SU.cat) + ") on Padel Live: ";
    SU.inv = url; render();
    try { if (navigator.share){ await navigator.share({title: TNAME, text: msg, url}); return; } } catch (er) { if (er && er.name === "AbortError") return; }
    window.open("https://wa.me/?text=" + encodeURIComponent(msg + url), "_blank"); return; }
  if ("suclose" in d){ SU.open = false; SU.check = null; SU.msg = ""; render(); return; }
  if (d.sucat){ SU.cat = d.sucat; SU.msg = "";
    if (SU.info && (!SU.info.level || SU.autoLv)){ const lv = START_LV[d.sucat] || 2.5; const r = await sb.rpc("set_my_level", {p_level: lv, p_claim: {src: "event", cat: d.sucat, raw: lv}});
      if (r.error){ SU.msg = r.error.message; render(); return; } SU.autoLv = true; SU.info.level = lv; }
    suCheck(); render(); return; }
  if (d.suocat != null){ SU.orgCat = d.suocat; render(); return; }
  if ("susend" in d){ SU.busy = true; SU.msg = ""; render();
    const r = await sb.rpc("t_signup", {p_slug: SLUG, p_cat: SU.cat, p_partner_phone: SU.phone, p_note: SU.note || null}); SU.busy = false;
    if (r.error){ SU.msg = r.error.message; render(); return; }
    SU.open = false; SU.phone = ""; SU.note = ""; SU.check = null; await loadSU(); return; }
  if ("suwd" in d){ if (!confirm("Withdraw your team from this tournament?")) return; const r = await sb.rpc("t_withdraw", {p_slug: SLUG}); if (r.error){ alert(r.error.message); return; } await loadSU(); pull(true); return; }
  if (d.suset){ if (d.sust === "rejected" && !confirm("Remove this team?")) return; b.disabled = true;
    const r = await sb.rpc("t_entry_set", {p_id: d.suset, p_status: d.sust}); if (r.error){ alert(r.error.message); b.disabled = false; return; } await loadSU(); pull(true); return; }
});
document.addEventListener("input", e => { const el = e.target;
  if (el.id === "su-phone"){ SU.phone = el.value; suCheck(); return; }
  if (el.id === "su-aname"){ SU.aName = el.value; return; } if (el.id === "su-aphone"){ SU.aPhone = el.value; return; }
  if (el.id === "su-note"){ SU.note = el.value; return; } });
loadSU().then(() => { if (location.hash === "#signup"){ const e = document.querySelector(".su"); if (e) e.scrollIntoView({block: "start"}); } });
render();
setInterval(() => { if (!document.hidden) pull(); }, MODE ? 3000 : 8000);
/* instant updates: every score change is pushed to the TV and phones the moment it happens (the timer above stays as a backup) */
let RT = null;
try { if (sb.channel){ RT = sb.channel("tour-" + SLUG, {config: {broadcast: {self: false}}})
  .on("broadcast", {event: "bump"}, m => { const v = m && m.payload && m.payload.v; if (v == null || v !== VERSION) pull(); })
  .subscribe(); } } catch (e) { RT = null; }
window.__rtBump = v => { try { if (RT) RT.send({type: "broadcast", event: "bump", payload: {v}}); } catch (e) {} };
document.addEventListener("visibilitychange", () => { if (!document.hidden) pull(); });
(async () => { try { const r = await sb.rpc("t_can_edit", {p_slug: SLUG}); if (r.data === true){ canEdit = true; render(); syncResults(); setInterval(() => syncResults(), 20000); } } catch (e) {} })();
/* finished matches go to Padel Live: levels, wins, challenges (only teams that signed up in the app) */
let lastSync = "";
async function syncResults(pin){ if (!canEdit && !pin) return;
  try { const rows = allMatches().filter(m => m.A && m.B && m.A.id && m.B.id && m.s && m.w !== null && m.w !== undefined && !m.flag).map(m => ({mid: m.id, t1: m.A.id, t2: m.B.id, s: m.s, w: m.w}));
    const key = JSON.stringify(rows); if (!rows.length || key === lastSync) return;
    const r = await sb.rpc("t_sync_results", {p_slug: SLUG, p_rows: rows, p_pin: pin || null}); if (!r.error) lastSync = key; } catch (e) {} }

}
function tFail(msg){ document.getElementById("app").innerHTML = '<div style="padding:40px 20px;font:500 16px system-ui;color:#333"><p><b>' + msg + '</b></p><p><a href="./">Open Padel Live</a></p><button onclick="location.reload()" style="padding:10px 16px;font:600 15px system-ui">Try again</button></div>'; }
async function tImport(slug, sb){
  var f = null; try { var x = await fetch(slug + ".json", {cache: "no-store"}); if (x.ok) f = await x.json(); } catch (e) {}
  if (!f){ tFail("This tournament isn't published yet."); return; }
  var clubs = []; try { var c = await sb.rpc("my_clubs"); clubs = c.data || []; } catch (e) {}
  if (!clubs.length){ tFail("This tournament isn't published yet. Club staff: sign in to Padel Live first, then open this page again to publish it."); return; }
  document.getElementById("app").innerHTML = '<div style="padding:40px 20px;font:500 16px system-ui;color:#333"><p><b>' + f.name + '</b> is ready to publish to ' + clubs[0].name + '.</p><button id="timp" style="padding:12px 18px;font:700 16px system-ui;border-radius:10px;border:0;background:#1A6B3C;color:#fff">Publish tournament</button><p id="tmsg"></p></div>';
  document.getElementById("timp").onclick = async function(){
    this.disabled = true; var r = await sb.rpc("t_create", {p_slug: slug, p_name: f.name, p_club: clubs[0].id, p_starts: f.starts_on, p_ends: f.ends_on, p_config: f.config, p_state: f.state});
    if (r.error){ document.getElementById("tmsg").textContent = r.error.message; this.disabled = false; return; }
    location.reload();
  };
}
async function tBoot(){
  var slug = (location.search.replace(/^\?/, "").split("&")[0] || "").replace(/[^a-z0-9-]/g, "");
  if (!slug){ tFail("No tournament chosen."); return; }
  var sb;
  try { sb = window.__MOCK || window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY, {auth:{lock: async function(n, w, fn){ return await fn(); }}}); } catch (e) { tFail("Can't reach the server."); return; }
  var timer = setTimeout(function(){ tFail("Can't reach the server. Check your connection."); }, 15000);
  try {
    var r = await sb.rpc("t_get", {p_slug: slug});
    clearTimeout(timer);
    if (r.error) throw r.error;
    if (!r.data){ tImport(slug, sb); return; }
    document.title = r.data.name + " · Padel Live";
    startT(r.data.config, r.data.state || {}, r.data.version, slug, r.data.name, sb, r.data.edit_version || 1);
  } catch (e) { clearTimeout(timer); tFail("Can't load the tournament right now."); }
}
(function(){
  if (window.__MOCK) return tBoot();
  var started = false, go = function(){ if (!started){ started = true; tBoot(); } };
  var a = document.createElement("script"); a.src = "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.50.0";
  a.onload = go; a.onerror = function(){ var b = document.createElement("script"); b.src = "https://unpkg.com/@supabase/supabase-js@2.50.0/dist/umd/supabase.js"; b.onload = go; b.onerror = go; document.body.appendChild(b); };
  setTimeout(go, 15000); document.body.appendChild(a);
})();
